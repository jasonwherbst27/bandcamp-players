<!DOCTYPE html>
<html lang="en" data-ink="acid-foil">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Heavy Psych Sounds Records · Silkscreen Archive Player</title>
  <meta name="description" content="Complete Bandcamp discography player for Heavy Psych Sounds Records (Rome, Italy) featuring 489 releases across 172 artists (2012–2027), styled after the label's psychedelic silkscreen album covers." />
  <meta property="og:title" content="Heavy Psych Sounds Records · Silkscreen Archive" />
  <meta property="og:description" content="Browse and stream all 489 Heavy Psych Sounds Bandcamp releases with silkscreen ink palettes, liquid-light projection, A–Z index rail, Cover Wall, persistent Now-Playing Bar, and Chrome Cast." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&family=Fraunces:ital,opsz,SOFT,WONK,wght@0,9..144,80,1,600..900;1,9..144,80,1,600..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      /* 60% Matte Screenprint Ink Stock */
      --bg: #0e0b0c;
      --bg-deep: #090708;
      /* 30% Structural Poster Stock */
      --surface: #171214;
      --surface-2: #1f181b;
      --surface-hover: #261e22;
      --ink: #f2ead9;
      --ink-soft: #bfb4a3;
      --ink-dim: #8a7f72;
      --rule: rgba(242, 234, 217, 0.14);
      --rule-strong: rgba(242, 234, 217, 0.28);
      /* 10% Cover-Derived Silkscreen Inks (Default: Acid Foil — Superskull Gold + Nebula Magenta) */
      --accent: #e6b83e;
      --accent-ink: #110c09;
      --accent-2: #e83e72;
      --accent-rgb: 230, 184, 62;
      --accent2-rgb: 232, 62, 114;
      --bc-bg: 171214;
      --bc-link: e6b83e;

      --ease: cubic-bezier(0.16, 1, 0.3, 1);
      --font-display: 'Fraunces', Georgia, serif;
      --font-body: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'IBM Plex Mono', monospace;
    }

    /* Screenprint Palette 2: Under Acid Hoof (Acid Mammoth — Cinnabar Blood + Aged Bone) */
    html[data-ink="acid-hoof"] {
      --bg: #0f0a0a;
      --surface: #191111;
      --surface-2: #221616;
      --surface-hover: #2b1b1b;
      --accent: #e05246;
      --accent-ink: #0f0909;
      --accent-2: #e8d9b5;
      --accent-rgb: 224, 82, 70;
      --accent2-rgb: 232, 217, 181;
      --bc-bg: 191111;
      --bc-link: e05246;
    }

    /* Screenprint Palette 3: Rosin Haze (Bongzilla — Acid Moss Olive + Oxide Crimson) */
    html[data-ink="rosin-haze"] {
      --bg: #0d0e0b;
      --surface: #161813;
      --surface-2: #1e2119;
      --surface-hover: #25291f;
      --accent: #aec437;
      --accent-ink: #0d0e0a;
      --accent-2: #d6504b;
      --accent-rgb: 174, 196, 55;
      --accent2-rgb: 214, 80, 75;
      --bc-bg: 161813;
      --bc-link: aec437;
    }

    /* Screenprint Palette 4: Cosmic Skull (Superskull Turquoise + Jalamanta Sun Gold) */
    html[data-ink="cosmic-skull"] {
      --bg: #0b0e0f;
      --surface: #12181a;
      --surface-2: #192225;
      --surface-hover: #202c30;
      --accent: #35cfc3;
      --accent-ink: #081213;
      --accent-2: #e6b83e;
      --accent-rgb: 53, 207, 195;
      --accent2-rgb: 230, 184, 62;
      --bc-bg: 12181a;
      --bc-link: 35cfc3;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-body);
      font-size: 15px;
      line-height: 1.5;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    button, input, select, a { font-family: inherit; }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* Subtle screenprint ink wash & risograph paper tooth */
    .ink-wash {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 68% 44% at 14% 0%, rgba(var(--accent-rgb), 0.11), transparent 64%),
        radial-gradient(ellipse 56% 40% at 88% 8%, rgba(var(--accent2-rgb), 0.10), transparent 66%);
      transition: background 0.4s ease;
    }

    .paper-tooth {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      opacity: 0.085;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 220 220' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      mix-blend-mode: overlay;
    }

    /* APP SHELL */
    .app-shell {
      position: relative;
      z-index: 2;
      max-width: 1460px;
      margin: 0 auto;
      padding: 0 24px 36px;
    }

    @media (max-width: 720px) {
      .app-shell { padding: 0 14px 28px; }
    }

    /* TOP BAR (Clean Single-Row 3-Zone Header) */
    .top-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 16px 0 14px;
      border-bottom: 1px solid var(--rule);
      flex-wrap: wrap;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 18px;
      min-width: 0;
    }

    .back-link {
      color: var(--ink-soft);
      text-decoration: none;
      font-family: var(--font-mono);
      font-size: 12px;
      white-space: nowrap;
      flex-shrink: 0;
      padding: 6px 0;
      border-bottom: 1px solid transparent;
      transition: color 0.16s var(--ease), border-color 0.16s var(--ease);
    }
    .back-link:hover {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 12px;
      min-width: 0;
    }

    .brand-title {
      font-family: var(--font-display);
      font-size: clamp(1.35rem, 2.2vw, 1.85rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1;
      color: var(--ink);
      white-space: nowrap;
      font-variation-settings: "SOFT" 80, "WONK" 1;
    }
    .brand-title em {
      font-style: normal;
      color: var(--accent);
    }

    .brand-meta {
      font-family: var(--font-mono);
      font-size: 11.5px;
      color: var(--ink-dim);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    @media (max-width: 900px) {
      .brand-meta { display: none; }
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .hdr-btn {
      background: var(--surface);
      color: var(--ink);
      border: 1px solid var(--rule-strong);
      border-radius: 2px;
      padding: 8px 13px;
      min-height: 38px;
      font-family: var(--font-mono);
      font-size: 11.5px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: background 0.15s var(--ease), color 0.15s var(--ease), border-color 0.15s var(--ease);
    }
    .hdr-btn:hover {
      background: var(--surface-hover);
      border-color: var(--accent);
      color: var(--accent);
    }
    .hdr-btn.active {
      background: var(--accent);
      color: var(--accent-ink);
      border-color: var(--accent);
      font-weight: 600;
    }

    /* SILKSCREEN POSTER PRESS & LIQUID-LIGHT STRIP */
    .press-strip {
      position: relative;
      margin: 16px 0 14px;
      background: var(--surface);
      border: 1px solid var(--rule-strong);
      border-radius: 2px;
      overflow: hidden;
      display: grid;
      grid-template-columns: 230px 1fr auto;
      align-items: center;
      min-height: 78px;
    }

    /* Silkscreen registration crosshairs on corners */
    .press-strip::before,
    .press-strip::after {
      content: "+";
      position: absolute;
      font-family: var(--font-mono);
      font-size: 11px;
      line-height: 1;
      color: var(--ink-dim);
      pointer-events: none;
      z-index: 4;
    }
    .press-strip::before { top: 4px; left: 6px; }
    .press-strip::after { bottom: 4px; right: 6px; }

    @media (max-width: 980px) {
      .press-strip {
        grid-template-columns: 1fr;
      }
    }

    .oil-stage {
      position: relative;
      height: 78px;
      border-right: 1px solid var(--rule);
      background: #0a0709;
      overflow: hidden;
    }
    @media (max-width: 980px) {
      .oil-stage {
        height: 46px;
        border-right: none;
        border-bottom: 1px solid var(--rule);
      }
    }

    #oilCanvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .oil-toggle {
      position: absolute;
      bottom: 6px;
      right: 6px;
      background: rgba(14, 11, 12, 0.82);
      color: var(--ink-soft);
      border: 1px solid var(--rule-strong);
      border-radius: 2px;
      padding: 3px 8px;
      font-family: var(--font-mono);
      font-size: 10px;
      cursor: pointer;
      transition: color 0.15s var(--ease), border-color 0.15s var(--ease);
    }
    .oil-toggle:hover {
      color: var(--accent);
      border-color: var(--accent);
    }

    .press-readout {
      padding: 12px 20px;
      min-width: 0;
    }

    .press-title-line {
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 700;
      line-height: 1.18;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-variation-settings: "SOFT" 70, "WONK" 1;
    }
    .press-title-line span {
      color: var(--accent);
    }

    .press-sub-line {
      margin-top: 3px;
      font-family: var(--font-mono);
      font-size: 11.5px;
      color: var(--ink-dim);
      font-variant-numeric: tabular-nums;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }
    .press-sub-line b {
      color: var(--ink-soft);
      font-weight: 600;
    }

    .ink-switcher {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 10px 18px;
      border-left: 1px solid var(--rule);
      flex-wrap: wrap;
    }
    @media (max-width: 980px) {
      .ink-switcher {
        border-left: none;
        border-top: 1px solid var(--rule);
        padding: 10px 16px;
      }
    }

    .ink-label {
      font-family: var(--font-mono);
      font-size: 10.5px;
      color: var(--ink-dim);
      margin-right: 4px;
      white-space: nowrap;
    }

    .ink-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-deep);
      color: var(--ink-soft);
      border: 1px solid var(--rule);
      border-radius: 2px;
      padding: 6px 10px;
      min-height: 34px;
      font-family: var(--font-mono);
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
      transition: border-color 0.15s var(--ease), color 0.15s var(--ease), background 0.15s var(--ease);
    }
    .ink-btn:hover {
      color: var(--ink);
      border-color: var(--rule-strong);
    }
    .ink-btn.active {
      background: var(--surface-hover);
      color: var(--ink);
      border-color: var(--accent);
      font-weight: 600;
    }

    .ink-swatch {
      width: 10px;
      height: 10px;
      border-radius: 1px;
      display: inline-block;
      flex-shrink: 0;
      border: 1px solid rgba(255, 255, 255, 0.25);
    }

    /* CORE ROSTER QUICK-FILTER BAR */
    .roster-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      padding: 4px 0 12px;
      scrollbar-width: thin;
      scrollbar-color: var(--rule-strong) transparent;
    }

    .roster-btn {
      background: transparent;
      color: var(--ink-soft);
      border: 1px solid var(--rule);
      border-radius: 2px;
      padding: 7px 12px;
      min-height: 36px;
      font-family: var(--font-mono);
      font-size: 11.5px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
      transition: background 0.15s var(--ease), color 0.15s var(--ease), border-color 0.15s var(--ease);
    }
    .roster-btn:hover {
      color: var(--ink);
      border-color: var(--rule-strong);
      background: var(--surface);
    }
    .roster-btn.active {
      background: var(--accent);
      color: var(--accent-ink);
      border-color: var(--accent);
      font-weight: 600;
    }
    .roster-btn.doom-btn {
      border-color: rgba(var(--accent2-rgb), 0.45);
      color: var(--ink);
    }
    .roster-btn.doom-btn.active {
      background: var(--accent-2);
      color: #0e0a0b;
      border-color: var(--accent-2);
    }

    /* CONTROLS TOOLBAR */
    .controls-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      padding: 12px 0 16px;
      border-top: 1px solid var(--rule);
      border-bottom: 1px solid var(--rule);
      margin-bottom: 18px;
    }

    .search-wrap {
      position: relative;
      flex: 1 1 250px;
      min-width: 200px;
    }

    .search-input {
      width: 100%;
      min-height: 40px;
      background: var(--surface);
      color: var(--ink);
      border: 1px solid var(--rule-strong);
      border-radius: 2px;
      padding: 8px 34px 8px 12px;
      font-size: 14px;
      transition: border-color 0.15s var(--ease), background 0.15s var(--ease);
    }
    .search-input::placeholder { color: var(--ink-dim); }
    .search-input:focus {
      outline: none;
      border-color: var(--accent);
      background: var(--surface-2);
    }

    .search-clear {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: var(--ink-dim);
      font-size: 16px;
      cursor: pointer;
      width: 24px;
      height: 24px;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .search-clear.visible { display: inline-flex; }
    .search-clear:hover { color: var(--ink); }

    .ctrl-select {
      min-height: 40px;
      background: var(--surface);
      color: var(--ink);
      border: 1px solid var(--rule-strong);
      border-radius: 2px;
      padding: 8px 12px;
      font-size: 13px;
      cursor: pointer;
      max-width: 210px;
    }
    .ctrl-select:hover { border-color: var(--accent); }

    .view-group {
      display: inline-flex;
      border: 1px solid var(--rule-strong);
      border-radius: 2px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .view-btn {
      background: var(--surface);
      color: var(--ink-soft);
      border: none;
      padding: 8px 13px;
      min-height: 38px;
      font-family: var(--font-mono);
      font-size: 11.5px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s var(--ease), color 0.15s var(--ease);
    }
    .view-btn + .view-btn { border-left: 1px solid var(--rule); }
    .view-btn:hover { color: var(--ink); }
    .view-btn.active {
      background: var(--accent);
      color: var(--accent-ink);
      font-weight: 600;
    }

    .reset-btn {
      display: none;
      min-height: 40px;
      background: transparent;
      color: var(--accent-2);
      border: 1px solid rgba(var(--accent2-rgb), 0.5);
      border-radius: 2px;
      padding: 8px 12px;
      font-family: var(--font-mono);
      font-size: 11.5px;
      cursor: pointer;
      white-space: nowrap;
    }
    .reset-btn.visible { display: inline-flex; align-items: center; }
    .reset-btn:hover {
      background: var(--accent-2);
      color: #0e0a0b;
    }

    .result-ledger {
      margin-left: auto;
      font-family: var(--font-mono);
      font-size: 11.5px;
      color: var(--ink-dim);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .result-ledger b { color: var(--ink); font-weight: 600; }

    /* MAIN 2-COLUMN WORKBENCH (Catalog + A–Z Rail | Listening Desk) */
    .workbench {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 410px;
      gap: 22px;
      align-items: start;
    }

    @media (max-width: 1120px) {
      .workbench {
        grid-template-columns: minmax(0, 1fr) 360px;
      }
    }

    @media (max-width: 920px) {
      .workbench {
        grid-template-columns: 1fr;
      }
    }

    /* LEFT: CATALOG + VERTICAL A-Z RAIL */
    .catalog-stage {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 34px;
      gap: 10px;
      align-items: start;
    }

    @media (max-width: 600px) {
      .catalog-stage {
        grid-template-columns: minmax(0, 1fr) 28px;
        gap: 6px;
      }
    }

    .catalog-scroll {
      height: calc(100vh - 255px);
      min-height: 480px;
      overflow-y: auto;
      padding-right: 6px;
      scrollbar-width: thin;
      scrollbar-color: var(--rule-strong) transparent;
      scroll-behavior: smooth;
    }
    @media (max-width: 920px) {
      .catalog-scroll {
        height: 62vh;
        min-height: 420px;
      }
    }

    .section-divider {
      position: sticky;
      top: 0;
      z-index: 6;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 12px;
      margin: 14px 0 10px;
      background: var(--bg);
      border-top: 2px solid var(--accent);
      border-bottom: 1px solid var(--rule);
    }
    .section-divider:first-child { margin-top: 0; }

    .section-key {
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 800;
      line-height: 1;
      color: var(--accent);
      font-variation-settings: "SOFT" 70, "WONK" 1;
    }

    .section-count {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--ink-dim);
      font-variant-numeric: tabular-nums;
    }

    /* POSTER RACK GRID */
    .poster-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 14px;
      margin-bottom: 18px;
    }

    @media (max-width: 600px) {
      .poster-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }
    }

    .sleeve-card {
      position: relative;
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border: 1px solid var(--rule);
      border-radius: 2px;
      cursor: pointer;
      text-align: left;
      color: inherit;
      padding: 0;
      overflow: hidden;
      transition: transform 0.18s var(--ease), border-color 0.18s var(--ease), background 0.18s var(--ease);
    }

    .sleeve-card:hover {
      transform: translateY(-3px);
      border-color: var(--rule-strong);
      background: var(--surface-hover);
    }

    .sleeve-card.selected {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent);
      background: var(--surface-2);
    }

    .sleeve-art-wrap {
      position: relative;
      width: 100%;
      background: #120e10;
      overflow: hidden;
    }

    /* Subtle aged vinyl-sleeve ringwear sheen (inspired by Bongzilla cover) */
    .sleeve-art-wrap::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at 50% 50%, transparent 58%, rgba(242, 234, 217, 0.08) 64%, transparent 69%);
      opacity: 0;
      transition: opacity 0.2s var(--ease);
    }
    .sleeve-card:hover .sleeve-art-wrap::after,
    .sleeve-card.selected .sleeve-art-wrap::after {
      opacity: 1;
    }

    .sleeve-img {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      background: #161114;
      transition: transform 0.24s var(--ease);
    }
    .sleeve-card:hover .sleeve-img {
      transform: scale(1.03);
    }

    .sleeve-fallback {
      width: 100%;
      aspect-ratio: 1 / 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 14px;
      text-align: center;
      background: linear-gradient(135deg, #1b1418, #0e0a0c);
      color: var(--ink-soft);
      font-family: var(--font-display);
      font-size: 14px;
    }

    .sleeve-info {
      padding: 10px 11px 11px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      flex: 1;
    }

    .sleeve-artist {
      font-family: var(--font-display);
      font-size: 14.5px;
      font-weight: 700;
      line-height: 1.2;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .sleeve-card.selected .sleeve-artist {
      color: var(--accent);
    }

    .sleeve-album {
      font-size: 12.5px;
      color: var(--ink-soft);
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .sleeve-meta {
      margin-top: auto;
      padding-top: 6px;
      font-family: var(--font-mono);
      font-size: 10.5px;
      color: var(--ink-dim);
      font-variant-numeric: tabular-nums;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .sleeve-fav-mark {
      color: var(--accent-2);
      font-weight: 600;
    }

    /* LIST VIEW */
    .list-stack {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 16px;
    }

    .list-row {
      display: grid;
      grid-template-columns: 44px minmax(0, 1.05fr) minmax(0, 1.35fr) 54px 36px;
      align-items: center;
      gap: 12px;
      padding: 6px 10px;
      background: var(--surface);
      border: 1px solid var(--rule);
      border-radius: 2px;
      color: inherit;
      text-align: left;
      cursor: pointer;
      width: 100%;
      transition: background 0.14s var(--ease), border-color 0.14s var(--ease);
    }
    .list-row:hover {
      background: var(--surface-hover);
      border-color: var(--rule-strong);
    }
    .list-row.selected {
      background: var(--surface-2);
      border-color: var(--accent);
    }
    @media (max-width: 680px) {
      .list-row {
        grid-template-columns: 40px minmax(0, 1fr) 48px;
        gap: 8px;
      }
      .list-row .lr-title-col,
      .list-row .lr-fav {
        display: none;
      }
    }

    .lr-thumb {
      display: block;
      width: 44px;
      height: 44px;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 1px;
      background: #161114;
    }

    .lr-artist {
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 700;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .list-row.selected .lr-artist { color: var(--accent); }

    .lr-sub-mobile {
      display: none;
      font-size: 12px;
      color: var(--ink-soft);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    @media (max-width: 680px) {
      .lr-sub-mobile { display: block; }
    }

    .lr-title {
      font-size: 13.5px;
      color: var(--ink-soft);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .lr-year {
      font-family: var(--font-mono);
      font-size: 11.5px;
      color: var(--ink-dim);
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .lr-fav {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--accent-2);
      text-align: center;
    }

    .load-more-wrap {
      padding: 14px 0 24px;
      text-align: center;
    }

    .load-more-btn {
      background: var(--surface);
      color: var(--ink);
      border: 1px solid var(--rule-strong);
      border-radius: 2px;
      padding: 10px 22px;
      min-height: 40px;
      font-family: var(--font-mono);
      font-size: 12px;
      cursor: pointer;
      transition: background 0.15s var(--ease), border-color 0.15s var(--ease), color 0.15s var(--ease);
    }
    .load-more-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--surface-hover);
    }

    /* VERTICAL A–Z SCROLLBAR & CLICKABLE LETTER RAIL */
    .az-rail {
      position: relative;
      height: calc(100vh - 255px);
      min-height: 480px;
      background: var(--surface);
      border: 1px solid var(--rule);
      border-radius: 2px;
      padding: 4px 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      user-select: none;
      touch-action: none;
    }
    @media (max-width: 920px) {
      .az-rail {
        height: 62vh;
        min-height: 420px;
      }
    }

    .az-btn {
      width: 100%;
      flex: 1;
      min-height: 0;
      background: transparent;
      border: none;
      color: var(--ink-dim);
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.12s var(--ease), background 0.12s var(--ease);
    }
    .az-btn.has-items { color: var(--ink-soft); }
    .az-btn.has-items:hover {
      color: var(--accent);
      background: rgba(var(--accent-rgb), 0.12);
    }
    .az-btn.active {
      background: var(--accent);
      color: var(--accent-ink);
      font-weight: 700;
    }
    .az-btn:disabled {
      opacity: 0.25;
      cursor: default;
    }

    .az-toast {
      position: fixed;
      right: 452px;
      top: 50%;
      transform: translateY(-50%) scale(0.92);
      background: var(--accent);
      color: var(--accent-ink);
      font-family: var(--font-display);
      font-size: 32px;
      font-weight: 800;
      width: 58px;
      height: 58px;
      border-radius: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      opacity: 0;
      z-index: 40;
      transition: opacity 0.15s var(--ease), transform 0.15s var(--ease);
    }
    .az-toast.visible {
      opacity: 1;
      transform: translateY(-50%) scale(1);
    }
    @media (max-width: 920px) {
      .az-toast { right: 54px; }
    }

    /* RIGHT: STICKY LISTENING DESK (#detail) */
    #detail {
      position: sticky;
      top: 16px;
      background: var(--surface);
      border: 1px solid var(--rule-strong);
      border-radius: 2px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    @media (max-width: 920px) {
      #detail {
        position: static;
      }
    }

    /* Registration marks on Listening Desk corners */
    #detail::before,
    #detail::after {
      content: "+";
      position: absolute;
      font-family: var(--font-mono);
      font-size: 11px;
      line-height: 1;
      color: var(--ink-dim);
      pointer-events: none;
    }
    #detail::before { top: 4px; left: 6px; }
    #detail::after { bottom: 4px; right: 6px; }

    .booth-head {
      display: grid;
      grid-template-columns: 116px minmax(0, 1fr);
      gap: 14px;
      align-items: start;
    }

    .booth-cover-btn {
      position: relative;
      display: block;
      width: 116px;
      padding: 0;
      background: #120e10;
      border: 1px solid var(--rule-strong);
      border-radius: 2px;
      overflow: hidden;
      cursor: zoom-in;
      flex-shrink: 0;
    }
    .booth-cover-btn img {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 1 / 1;
      object-fit: cover;
    }
    .booth-cover-btn:hover {
      border-color: var(--accent);
    }

    .booth-titles {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .booth-kicker {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }

    .booth-artist {
      font-family: var(--font-display);
      font-size: 21px;
      font-weight: 800;
      line-height: 1.12;
      color: var(--ink);
      text-wrap: balance;
      font-variation-settings: "SOFT" 75, "WONK" 1;
    }

    .booth-album {
      font-size: 14.5px;
      font-weight: 500;
      color: var(--ink-soft);
      line-height: 1.35;
    }

    .booth-loc {
      margin-top: 4px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--ink-dim);
      font-variant-numeric: tabular-nums;
    }

    .booth-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding-top: 10px;
      border-top: 1px solid var(--rule);
    }

    .booth-btn {
      background: var(--surface-2);
      color: var(--ink);
      border: 1px solid var(--rule-strong);
      border-radius: 2px;
      padding: 7px 12px;
      min-height: 36px;
      font-family: var(--font-mono);
      font-size: 11.5px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
      transition: background 0.15s var(--ease), border-color 0.15s var(--ease), color 0.15s var(--ease);
    }
    .booth-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    .booth-btn.saved {
      background: var(--accent-2);
      color: #0e0a0b;
      border-color: var(--accent-2);
      font-weight: 600;
    }

    /* Bandcamp Embed Slot (intercepted cleanly by now-playing-dock.js) */
    .embed-slot {
      border-top: 1px solid var(--rule);
      padding-top: 12px;
    }

    .bc-iframe {
      width: 100%;
      height: 360px;
      border: 0;
      display: block;
      background: var(--surface);
    }
    .bc-iframe.track-embed {
      height: 120px;
    }

    /* MORE BY ARTIST + RECENTLY INSPECTED */
    .related-block {
      border-top: 1px solid var(--rule);
      padding-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .related-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--ink-dim);
      font-variant-numeric: tabular-nums;
    }

    .related-head button {
      background: transparent;
      border: none;
      color: var(--accent);
      font-family: inherit;
      font-size: 11px;
      cursor: pointer;
      text-decoration: underline;
    }

    .mini-strip {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: thin;
      scrollbar-color: var(--rule-strong) transparent;
    }

    .mini-tile {
      width: 68px;
      flex-shrink: 0;
      background: transparent;
      border: 1px solid var(--rule);
      border-radius: 2px;
      padding: 0;
      cursor: pointer;
      overflow: hidden;
      text-align: left;
      transition: border-color 0.15s var(--ease), transform 0.15s var(--ease);
    }
    .mini-tile:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }
    .mini-tile.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent);
    }
    .mini-tile img {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 1 / 1;
      object-fit: cover;
    }

    /* EMPTY STATE */
    .empty-state {
      padding: 48px 24px;
      text-align: center;
      background: var(--surface);
      border: 1px solid var(--rule);
      border-radius: 2px;
    }
    .empty-state h3 {
      font-family: var(--font-display);
      font-size: 22px;
      margin-bottom: 8px;
    }
    .empty-state p {
      color: var(--ink-soft);
      font-size: 14px;
      margin-bottom: 16px;
    }

    /* FULLSCREEN COVER WALL MODAL */
    .overlay-modal {
      position: fixed;
      inset: 0;
      z-index: 900;
      background: rgba(10, 8, 9, 0.96);
      display: none;
      flex-direction: column;
    }
    .overlay-modal.open { display: flex; }

    .modal-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 24px;
      border-bottom: 1px solid var(--rule-strong);
      background: var(--bg);
    }

    .modal-title {
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 700;
      color: var(--ink);
    }
    .modal-sub {
      font-family: var(--font-mono);
      font-size: 11.5px;
      color: var(--ink-dim);
      margin-left: 10px;
      font-variant-numeric: tabular-nums;
    }

    .wall-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 16px 24px 140px;
    }

    .wall-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 8px;
    }

    .wall-tile {
      position: relative;
      display: block;
      padding: 0;
      border: 1px solid var(--rule);
      background: #141012;
      cursor: pointer;
      overflow: hidden;
      transition: transform 0.16s var(--ease), border-color 0.16s var(--ease);
    }
    .wall-tile:hover {
      transform: scale(1.03);
      border-color: var(--accent);
      z-index: 2;
    }
    .wall-tile img {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 1 / 1;
      object-fit: cover;
    }
    .wall-caption {
      position: absolute;
      inset: auto 0 0 0;
      padding: 20px 8px 6px;
      background: linear-gradient(to top, rgba(10, 8, 9, 0.92), rgba(10, 8, 9, 0.55), transparent);
      color: var(--ink);
      font-size: 11px;
      line-height: 1.25;
      text-align: left;
      opacity: 0;
      transition: opacity 0.15s var(--ease);
    }
    .wall-tile:hover .wall-caption { opacity: 1; }
    .wall-caption strong { display: block; color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .wall-caption span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* LIGHTBOX */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 950;
      background: rgba(9, 7, 8, 0.95);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 28px;
    }
    .lightbox.open { display: flex; }

    .lightbox-inner {
      max-width: 720px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
      align-items: center;
    }

    .lightbox-img {
      display: block;
      width: min(560px, 84vw);
      height: auto;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border: 1px solid var(--rule-strong);
      background: #141012;
    }

    .lightbox-meta {
      text-align: center;
    }
    .lightbox-meta h3 {
      font-family: var(--font-display);
      font-size: 22px;
      color: var(--ink);
    }
    .lightbox-meta p {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--ink-soft);
      margin-top: 4px;
    }

    .lightbox-controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <div class="ink-wash" aria-hidden="true"></div>
  <div class="paper-tooth" aria-hidden="true"></div>

  <div class="app-shell">
    <header class="top-header">
      <div class="header-left">
        <a href="./index.html" class="back-link">← Back to All Players</a>
        <div class="brand">
          <h1 class="brand-title">Heavy <em>Psych</em> Sounds</h1>
          <span class="brand-meta">Rome, Italy · 489 Releases · 172 Artists · 2012–2027</span>
        </div>
      </div>
      <div class="header-actions">
        <button type="button" class="hdr-btn" id="coverWallBtn" title="Open full-screen Cover Wall (W)">Cover Wall</button>
        <button type="button" class="hdr-btn" id="randomBtn" title="Inspect a random release (R)">Random</button>
        <button type="button" class="hdr-btn" id="savedFilterBtn" title="Filter saved releases (F)">Saved (0)</button>
      </div>
    </header>

    <section class="press-strip" aria-label="Silkscreen ink and liquid light studio">
      <div class="oil-stage">
        <canvas id="oilCanvas" width="460" height="156" aria-hidden="true"></canvas>
        <button type="button" class="oil-toggle" id="oilToggleBtn" aria-pressed="true">Oil Light: On</button>
      </div>
      <div class="press-readout">
        <div class="press-title-line" id="pressTitle"><span>Heavy Psych Sounds</span> · Silkscreen &amp; Fuzz Archive</div>
        <div class="press-sub-line" id="pressSub">
          <span><b>489</b> Releases</span>
          <span aria-hidden="true">·</span>
          <span><b>172</b> Bands</span>
          <span aria-hidden="true">·</span>
          <span><b>9</b> Doom Sessions</span>
          <span aria-hidden="true">·</span>
          <span>Keys: / Search · L List · W Wall · R Random · ←/→ Browse</span>
        </div>
      </div>
      <div class="ink-switcher" role="group" aria-label="Silkscreen ink press palette">
        <span class="ink-label">Ink Press</span>
        <button type="button" class="ink-btn active" data-ink="acid-foil">
          <span class="ink-swatch" style="background: linear-gradient(135deg, #e6b83e 50%, #e83e72 50%);"></span>
          Acid Foil
        </button>
        <button type="button" class="ink-btn" data-ink="acid-hoof">
          <span class="ink-swatch" style="background: linear-gradient(135deg, #e05246 50%, #e8d9b5 50%);"></span>
          Acid Hoof
        </button>
        <button type="button" class="ink-btn" data-ink="rosin-haze">
          <span class="ink-swatch" style="background: linear-gradient(135deg, #aec437 50%, #d6504b 50%);"></span>
          Rosin Haze
        </button>
        <button type="button" class="ink-btn" data-ink="cosmic-skull">
          <span class="ink-swatch" style="background: linear-gradient(135deg, #35cfc3 50%, #e6b83e 50%);"></span>
          Cosmic Skull
        </button>
      </div>
    </section>

    <nav class="roster-bar" id="rosterBar" aria-label="Core roster quick filters"></nav>

    <section class="controls-bar" aria-label="Catalog search, sorting, and view controls">
      <div class="search-wrap">
        <input type="search" id="searchInput" class="search-input" placeholder="Search artist, album title, or year (press /)" autocomplete="off" aria-label="Search releases" />
        <button type="button" id="searchClear" class="search-clear" aria-label="Clear search">×</button>
      </div>
      <select id="artistSelect" class="ctrl-select" aria-label="Filter by artist"></select>
      <select id="yearSelect" class="ctrl-select" aria-label="Filter by year"></select>
      <select id="sortSelect" class="ctrl-select" aria-label="Sort releases">
        <option value="artist-asc">Artist A–Z</option>
        <option value="artist-desc">Artist Z–A</option>
        <option value="year-desc">Newest Year</option>
        <option value="year-asc">Oldest Year</option>
        <option value="title-asc">Album A–Z</option>
      </select>
      <div class="view-group" role="group" aria-label="Catalog view mode">
        <button type="button" class="view-btn active" id="viewRackBtn">Poster Rack</button>
        <button type="button" class="view-btn" id="viewListBtn">List</button>
      </div>
      <button type="button" class="reset-btn" id="resetBtn">Reset</button>
      <div class="result-ledger" id="resultLedger"></div>
    </section>

    <main class="workbench">
      <section class="catalog-stage" aria-label="Release catalog">
        <div class="catalog-scroll" id="catalogScroll"></div>
        <aside class="az-rail" id="azRail" aria-label="Alphabetical quick jump"></aside>
      </section>

      <aside id="detail" aria-label="Release inspection and listening desk"></aside>
    </main>
  </div>

  <div class="az-toast" id="azToast" aria-hidden="true"></div>

  <!-- FULLSCREEN COVER WALL -->
  <div class="overlay-modal" id="wallModal" role="dialog" aria-modal="true" aria-label="Cover Wall">
    <div class="modal-bar">
      <div>
        <span class="modal-title">Heavy Psych Sounds · Cover Wall</span>
        <span class="modal-sub" id="wallSub"></span>
      </div>
      <button type="button" class="hdr-btn" id="wallCloseBtn">Close (Esc)</button>
    </div>
    <div class="wall-scroll" id="wallScroll">
      <div class="wall-grid" id="wallGrid"></div>
      <div class="load-more-wrap" id="wallMoreWrap"></div>
    </div>
  </div>

  <!-- ARTWORK LIGHTBOX -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Cover artwork viewer">
    <div class="lightbox-inner">
      <img id="lightboxImg" class="lightbox-img" alt="" referrerpolicy="no-referrer" />
      <div class="lightbox-meta">
        <h3 id="lightboxArtist"></h3>
        <p id="lightboxCaption"></p>
      </div>
      <div class="lightbox-controls">
        <button type="button" class="hdr-btn" id="lbPrevBtn">← Previous</button>
        <button type="button" class="hdr-btn" id="lbNextBtn">Next →</button>
        <button type="button" class="hdr-btn" id="lbCloseBtn">Close (Esc)</button>
      </div>
    </div>

      selectedId: null,
      visibleLimit: 72,
      wallLimit: 120,
      saved: new Set(JSON.parse(localStorage.getItem(STORAGE_FAVS) || "[]")),
      recent: JSON.parse(localStorage.getItem(STORAGE_RECENT) || "[]").filter((id) => BY_ID.has(id)),
      filtered: [],
      oilOn: !window.matchMedia("(prefers-reduced-motion: reduce)").matches
    };

    if (!INK_CONFIG[state.ink]) state.ink = "acid-foil";

    const dom = {
      rosterBar: document.getElementById("rosterBar"),
      searchInput: document.getElementById("searchInput"),
      searchClear: document.getElementById("searchClear"),
      artistSelect: document.getElementById("artistSelect"),
      yearSelect: document.getElementById("yearSelect"),
      sortSelect: document.getElementById("sortSelect"),
      viewRackBtn: document.getElementById("viewRackBtn"),
      viewListBtn: document.getElementById("viewListBtn"),
      resetBtn: document.getElementById("resetBtn"),
      resultLedger: document.getElementById("resultLedger"),
      catalogScroll: document.getElementById("catalogScroll"),
      azRail: document.getElementById("azRail"),
      azToast: document.getElementById("azToast"),
      detail: document.getElementById("detail"),
      pressTitle: document.getElementById("pressTitle"),
      savedFilterBtn: document.getElementById("savedFilterBtn"),
      randomBtn: document.getElementById("randomBtn"),
      coverWallBtn: document.getElementById("coverWallBtn"),
      wallModal: document.getElementById("wallModal"),
      wallCloseBtn: document.getElementById("wallCloseBtn"),
      wallSub: document.getElementById("wallSub"),
      wallGrid: document.getElementById("wallGrid"),
      wallMoreWrap: document.getElementById("wallMoreWrap"),
      lightbox: document.getElementById("lightbox"),
      lightboxImg: document.getElementById("lightboxImg"),
      lightboxArtist: document.getElementById("lightboxArtist"),
      lightboxCaption: document.getElementById("lightboxCaption"),
      lbPrevBtn: document.getElementById("lbPrevBtn"),
      lbNextBtn: document.getElementById("lbNextBtn"),
      lbCloseBtn: document.getElementById("lbCloseBtn"),
      oilCanvas: document.getElementById("oilCanvas"),
      oilToggleBtn: document.getElementById("oilToggleBtn")
    };

    function artUrl(artId, size) {
      return "https://f4.bcbits.com/img/a" + artId + "_" + (size || 16) + ".jpg";
    }

    function esc(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function applyInk(inkKey, persist) {
      if (!INK_CONFIG[inkKey]) return;
      state.ink = inkKey;
      document.documentElement.setAttribute("data-ink", inkKey);
      if (persist) {
        try { localStorage.setItem(STORAGE_INK, inkKey); } catch {}
      }
      document.querySelectorAll(".ink-btn").forEach((b) => {
        b.classList.toggle("active", b.dataset.ink === inkKey);
      });
      pulseOil(1.2);
    }

    function saveFavs() {
      try { localStorage.setItem(STORAGE_FAVS, JSON.stringify([...state.saved])); } catch {}
      dom.savedFilterBtn.textContent = "Saved (" + state.saved.size + ")";
      dom.savedFilterBtn.classList.toggle("active", state.savedOnly);
    }

    function pushRecent(id) {
      state.recent = [id, ...state.recent.filter((x) => x !== id)].slice(0, 12);
      try { localStorage.setItem(STORAGE_RECENT, JSON.stringify(state.recent)); } catch {}
    }

    function populateDropdowns() {
      const artists = [...ARTIST_MAP.keys()].sort((a, b) => a.localeCompare(b));
      dom.artistSelect.innerHTML =
        '<option value="ALL">All Artists (' + artists.length + ')</option>' +
        artists.map((a) => '<option value="' + esc(a) + '">' + esc(a) + ' (' + ARTIST_MAP.get(a).length + ')</option>').join("");

      const yearCounts = new Map();
      for (const r of RELEASES) {
        if (r.year) yearCounts.set(r.year, (yearCounts.get(r.year) || 0) + 1);
      }
      const years = [...yearCounts.keys()].sort((a, b) => b - a);
      dom.yearSelect.innerHTML =
        '<option value="ALL">All Years</option>' +
        years.map((y) => '<option value="' + y + '">' + y + ' (' + yearCounts.get(y) + ')</option>').join("");
    }

    function renderRosterBar() {
      const doomCount = RELEASES.filter((r) => r.isDoomSession).length;
      const parts = [];
      parts.push(
        '<button type="button" class="roster-btn' +
          (state.artist === "ALL" && !state.doomOnly ? " active" : "") +
          '" data-roster="ALL">All (' + RELEASES.length + ')</button>'
      );
      parts.push(
        '<button type="button" class="roster-btn doom-btn' +
          (state.doomOnly ? " active" : "") +
          '" data-roster="DOOM">Doom Sessions (' + doomCount + ')</button>'
      );
      for (const name of ROSTER_PICKS) {
        const list = ARTIST_MAP.get(name);
        if (!list) continue;
        parts.push(
          '<button type="button" class="roster-btn' +
            (state.artist === name && !state.doomOnly ? " active" : "") +
            '" data-roster="' + esc(name) + '">' + esc(name) + ' (' + list.length + ')</button>'
        );
      }
      dom.rosterBar.innerHTML = parts.join("");
    }

    function computeFiltered() {
      const q = state.query.trim().toLowerCase();
      let list = RELEASES.filter((r) => {
        if (state.doomOnly && !r.isDoomSession) return false;
        if (state.artist !== "ALL" && r.artist !== state.artist) return false;
        if (state.year !== "ALL" && String(r.year) !== String(state.year)) return false;
        if (state.savedOnly && !state.saved.has(r.id)) return false;
        if (q && !r.searchKey.includes(q)) return false;
        return true;
      });

      list = list.slice();
      switch (state.sort) {
        case "artist-desc":
          list.sort((a, b) => b.artist.localeCompare(a.artist) || b.year - a.year || a.title.localeCompare(b.title));
          break;
        case "year-desc":
          list.sort((a, b) => b.year - a.year || b.isoDate.localeCompare(a.isoDate) || a.artist.localeCompare(b.artist));
          break;
        case "year-asc":
          list.sort((a, b) => a.year - b.year || a.isoDate.localeCompare(b.isoDate) || a.artist.localeCompare(b.artist));
          break;
        case "title-asc":
          list.sort((a, b) => a.title.localeCompare(b.title) || a.artist.localeCompare(b.artist));
          break;
        default:
          list.sort((a, b) => a.artist.localeCompare(b.artist) || b.year - a.year || a.title.localeCompare(b.title));
      }

      state.filtered = list;
      const hasFilters = Boolean(q || state.artist !== "ALL" || state.year !== "ALL" || state.doomOnly || state.savedOnly);
      dom.resetBtn.classList.toggle("visible", hasFilters);
      dom.searchClear.classList.toggle("visible", Boolean(q));
      dom.resultLedger.innerHTML = "Showing <b>" + list.length + "</b> of " + RELEASES.length;
    }

    function groupKeyFor(item) {
      if (state.sort === "year-desc" || state.sort === "year-asc") {
        return item.year ? String(item.year) : "Unknown";
      }
      if (state.sort === "title-asc") {
        const ch = (item.title.replace(/^[^A-Za-z0-9]+/, "")[0] || "#").toUpperCase();
        return /[A-Z]/.test(ch) ? ch : "#";
      }
      return item.letter || "#";
    }

    function renderCatalog() {
      const list = state.filtered;
      if (!list.length) {
        dom.catalogScroll.innerHTML =
          '<div class="empty-state">' +
            '<h3>No releases match those filters</h3>' +
            '<p>Try clearing your search or switching back to the full Heavy Psych Sounds archive.</p>' +
            '<button type="button" class="hdr-btn active" id="emptyResetBtn">Show All ' + RELEASES.length + ' Releases</button>' +
          '</div>';
        const btn = document.getElementById("emptyResetBtn");
        if (btn) btn.addEventListener("click", resetFilters);
        renderAzRail();
        return;
      }

      const slice = list.slice(0, state.visibleLimit);
      const groups = new Map();
      for (const item of slice) {
        const key = groupKeyFor(item);
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(item);
      }

      const fullCounts = new Map();
      for (const item of list) {
        const key = groupKeyFor(item);
        fullCounts.set(key, (fullCounts.get(key) || 0) + 1);
      }

      const htmlParts = [];
      for (const [key, items] of groups.entries()) {
        const totalInGroup = fullCounts.get(key) || items.length;
        htmlParts.push(
          '<div class="section-divider" data-section="' + esc(key) + '">' +
            '<span class="section-key">' + esc(key) + '</span>' +
            '<span class="section-count">' + totalInGroup + (totalInGroup === 1 ? " release" : " releases") + '</span>' +
          '</div>'
        );

        if (state.view === "list") {
          htmlParts.push('<div class="list-stack">');
          for (const item of items) {
            const isSel = item.id === state.selectedId;
            const isFav = state.saved.has(item.id);
            htmlParts.push(
              '<button type="button" class="list-row' + (isSel ? " selected" : "") + '" data-id="' + item.id + '">' +
                '<img class="lr-thumb" src="' + artUrl(item.artId, 9) + '" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.visibility=&apos;hidden&apos;" />' +
                '<div style="min-width:0">' +
                  '<div class="lr-artist">' + esc(item.artist) + '</div>' +
                  '<div class="lr-sub-mobile">' + esc(item.title) + '</div>' +
                '</div>' +
                '<div class="lr-title lr-title-col">' + esc(item.title) + '</div>' +
                '<div class="lr-year">' + (item.year || "—") + '</div>' +
                '<div class="lr-fav">' + (isFav ? "★" : "") + '</div>' +
              '</button>'
            );
          }
          htmlParts.push('</div>');
        } else {
          htmlParts.push('<div class="poster-grid">');
          for (const item of items) {
            const isSel = item.id === state.selectedId;
            const isFav = state.saved.has(item.id);
            htmlParts.push(
              '<button type="button" class="sleeve-card' + (isSel ? " selected" : "") + '" data-id="' + item.id + '">' +
                '<div class="sleeve-art-wrap">' +
                  '<img class="sleeve-img" src="' + artUrl(item.artId, 16) + '" alt="' + esc(item.artist + " - " + item.title) + '" loading="lazy" referrerpolicy="no-referrer" onerror="this.outerHTML=&apos;<div class=sleeve-fallback>' + esc(item.artist).replace(/'/g, "") + '</div>&apos;" />' +
                '</div>' +
                '<div class="sleeve-info">' +
                  '<div class="sleeve-artist">' + esc(item.artist) + '</div>' +
                  '<div class="sleeve-album">' + esc(item.title) + '</div>' +
                  '<div class="sleeve-meta">' +
                    '<span>' + (item.year || "—") + ' · ' + (item.type === "t" ? "Single" : "Album") + '</span>' +
                    (isFav ? '<span class="sleeve-fav-mark" title="Saved">★</span>' : '') +
                  '</div>' +
                '</div>' +
              '</button>'
            );
          }
          htmlParts.push('</div>');
        }
      }

      if (list.length > slice.length) {
        const remaining = list.length - slice.length;
        htmlParts.push(
          '<div class="load-more-wrap">' +
            '<button type="button" class="load-more-btn" id="loadMoreBtn">Load More Releases (' + remaining + ' remaining)</button>' +
          '</div>'
        );
      }

      dom.catalogScroll.innerHTML = htmlParts.join("");
      const moreBtn = document.getElementById("loadMoreBtn");
      if (moreBtn) {
        moreBtn.addEventListener("click", () => {
          state.visibleLimit += 84;
          renderCatalog();
        });
      }

      renderAzRail();
    }

    function renderAzRail() {
      const letters = ["#", ..."ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("")];
      const available = new Set();
      for (const item of state.filtered) {
        if (state.sort === "title-asc") {
          const ch = (item.title.replace(/^[^A-Za-z0-9]+/, "")[0] || "#").toUpperCase();
          available.add(/[A-Z]/.test(ch) ? ch : "#");
        } else {
          available.add(item.letter || "#");
        }
      }

      dom.azRail.innerHTML = letters
        .map((ch) => {
          const has = available.has(ch);
          return (
            '<button type="button" class="az-btn' + (has ? " has-items" : "") + '" data-letter="' + ch + '"' + (has ? "" : " disabled") + '>' +
              ch +
            '</button>'
          );
        })
        .join("");

      updateActiveAzLetter();
    }

    let azToastTimer = null;
    function showAzToast(letter) {
      dom.azToast.textContent = letter;
      dom.azToast.classList.add("visible");
      clearTimeout(azToastTimer);
      azToastTimer = setTimeout(() => dom.azToast.classList.remove("visible"), 520);
    }

    function jumpToLetter(letter) {
      // If currently sorted by year, switch to Artist A-Z so A-Z jump is exact
      if (state.sort === "year-desc" || state.sort === "year-asc") {
        state.sort = "artist-asc";
        dom.sortSelect.value = "artist-asc";
        computeFiltered();
      }

      const idx = state.filtered.findIndex((item) => {
        if (state.sort === "title-asc") {
          const ch = (item.title.replace(/^[^A-Za-z0-9]+/, "")[0] || "#").toUpperCase();
          return (/[A-Z]/.test(ch) ? ch : "#") === letter;
        }
        return (item.letter || "#") === letter;
      });
      if (idx < 0) return;

      if (idx + 36 > state.visibleLimit) {
        state.visibleLimit = Math.min(state.filtered.length, idx + 72);
        renderCatalog();
      }

      const sec = dom.catalogScroll.querySelector('.section-divider[data-section="' + letter + '"]');
      if (sec) {
        dom.catalogScroll.scrollTop = Math.max(0, sec.offsetTop - 4);
      }
      showAzToast(letter);
      updateActiveAzLetter(letter);
    }

    function updateActiveAzLetter(forced) {
      let current = forced || null;
      if (!current) {
        const secs = dom.catalogScroll.querySelectorAll(".section-divider");
        const top = dom.catalogScroll.scrollTop + 24;
        for (const s of secs) {
          if (s.offsetTop <= top) current = s.dataset.section;
        }
      }
      dom.azRail.querySelectorAll(".az-btn").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.letter === current);
      });
    }

    function renderDetail(item) {
      if (!item) {
        dom.detail.innerHTML = '<div class="empty-state"><h3>Select a release</h3><p>Pick any album sleeve from the Heavy Psych Sounds catalog to inspect and listen.</p></div>';
        return;
      }

      state.selectedId = item.id;
      pushRecent(item.id);

      const isTrack = item.type === "t";
      const isFav = state.saved.has(item.id);
      const inkCfg = INK_CONFIG[state.ink] || INK_CONFIG["acid-foil"];
      const embedUrl =
        "https://bandcamp.com/EmbeddedPlayer/" +
        (isTrack ? "track=" : "album=") +
        item.id +
        "/size=large/bgcol=" + inkCfg.bcBg +
        "/linkcol=" + inkCfg.bcLink +
        "/artwork=none/transparent=true/";

      const artistItems = (ARTIST_MAP.get(item.artist) || []).slice().sort((a, b) => b.year - a.year);
      const moreByArtist = artistItems.filter((x) => x.id !== item.id);
      const recentItems = state.recent.map((id) => BY_ID.get(id)).filter(Boolean);

      dom.pressTitle.innerHTML = "<span>" + esc(item.artist) + "</span> · " + esc(item.title) + (item.year ? " (" + item.year + ")" : "");

      dom.detail.innerHTML =
        '<div class="booth-head">' +
          '<button type="button" class="booth-cover-btn" id="boothCoverBtn" title="Inspect cover artwork">' +
            '<img src="' + artUrl(item.artId, 16) + '" alt="' + esc(item.artist + " - " + item.title) + '" referrerpolicy="no-referrer" />' +
          '</button>' +
          '<div class="booth-titles">' +
            '<div class="booth-kicker">' + (item.year || "Archive") + ' · ' + (isTrack ? "Single" : "Full Album") + (item.isDoomSession ? " · Doom Sessions" : "") + '</div>' +
            '<h2 class="booth-artist">' + esc(item.artist) + '</h2>' +
            '<div class="booth-album">' + esc(item.title) + '</div>' +
            '<div class="booth-loc">Heavy Psych Sounds · Rome, Italy · ' + artistItems.length + (artistItems.length === 1 ? " release" : " releases") + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="booth-actions">' +
          '<button type="button" class="booth-btn" id="prevBtn" title="Previous release (←)">← Prev</button>' +
          '<button type="button" class="booth-btn" id="nextBtn" title="Next release (→)">Next →</button>' +
          '<button type="button" class="booth-btn' + (isFav ? " saved" : "") + '" id="favBtn">' + (isFav ? "★ Saved" : "☆ Save") + '</button>' +
          '<a class="booth-btn" href="' + esc(item.url) + '" target="_blank" rel="noopener noreferrer">Bandcamp ↗</a>' +
        '</div>' +
        '<div class="embed-slot">' +
          '<iframe class="bc-iframe' + (isTrack ? " track-embed" : "") + '" src="' + embedUrl + '" seamless title="' + esc(item.artist + " - " + item.title) + '"></iframe>' +
        '</div>' +
        (moreByArtist.length
          ? '<div class="related-block">' +
              '<div class="related-head">' +
                '<span>More by ' + esc(item.artist) + ' (' + moreByArtist.length + ')</span>' +
                '<button type="button" id="filterArtistBtn">Show all in catalog</button>' +
              '</div>' +
              '<div class="mini-strip">' +
                moreByArtist.slice(0, 14).map((m) =>
                  '<button type="button" class="mini-tile" data-jump-id="' + m.id + '" title="' + esc(m.title + (m.year ? " (" + m.year + ")" : "")) + '">' +
                    '<img src="' + artUrl(m.artId, 9) + '" alt="' + esc(m.title) + '" loading="lazy" referrerpolicy="no-referrer" />' +
                  '</button>'
                ).join("") +
              '</div>' +
            '</div>'
          : '') +
        (recentItems.length > 1
          ? '<div class="related-block">' +
              '<div class="related-head"><span>Recently Inspected (' + recentItems.length + ')</span></div>' +
              '<div class="mini-strip">' +
                recentItems.map((m) =>
                  '<button type="button" class="mini-tile' + (m.id === item.id ? " active" : "") + '" data-jump-id="' + m.id + '" title="' + esc(m.artist + " — " + m.title) + '">' +
                    '<img src="' + artUrl(m.artId, 9) + '" alt="' + esc(m.title) + '" loading="lazy" referrerpolicy="no-referrer" />' +
                  '</button>'
                ).join("") +
              '</div>' +
            '</div>'
          : '');

      // Highlight selected item in catalog without full re-render
      dom.catalogScroll.querySelectorAll(".sleeve-card.selected, .list-row.selected").forEach((el) => el.classList.remove("selected"));
      const activeCard = dom.catalogScroll.querySelector('[data-id="' + item.id + '"]');
      if (activeCard) activeCard.classList.add("selected");

      // Bind detail buttons
      const coverBtn = document.getElementById("boothCoverBtn");
      if (coverBtn) coverBtn.addEventListener("click", () => openLightbox(item));

      const prevBtn = document.getElementById("prevBtn");
      if (prevBtn) prevBtn.addEventListener("click", () => stepSelection(-1));

      const nextBtn = document.getElementById("nextBtn");
      if (nextBtn) nextBtn.addEventListener("click", () => stepSelection(1));

      const favBtn = document.getElementById("favBtn");
      if (favBtn) {
        favBtn.addEventListener("click", () => {
          if (state.saved.has(item.id)) state.saved.delete(item.id);
          else state.saved.add(item.id);
          saveFavs();
          if (state.savedOnly) {
            computeFiltered();
            renderCatalog();
          } else {
            renderCatalog();
          }
          renderDetail(item);
        });
      }

      const filterArtistBtn = document.getElementById("filterArtistBtn");
      if (filterArtistBtn) {
        filterArtistBtn.addEventListener("click", () => {
          state.artist = item.artist;
          state.doomOnly = false;
          dom.artistSelect.value = item.artist;
          state.visibleLimit = 72;
          renderRosterBar();
          computeFiltered();
          renderCatalog();
          dom.catalogScroll.scrollTop = 0;
        });
      }

      dom.detail.querySelectorAll("[data-jump-id]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const target = BY_ID.get(Number(btn.dataset.jumpId));
          if (target) {
            renderDetail(target);
            pulseOil(1.0);
          }
        });
      });

      pulseOil(0.95);
    }

    function stepSelection(delta) {
      const list = state.filtered.length ? state.filtered : RELEASES;
      const pos = list.findIndex((r) => r.id === state.selectedId);
      const nextIdx = pos < 0 ? 0 : (pos + delta + list.length) % list.length;
      const target = list[nextIdx];
      if (!target) return;
      if (nextIdx >= state.visibleLimit) {
        state.visibleLimit = nextIdx + 36;
        renderCatalog();
      }
      renderDetail(target);
      const el = dom.catalogScroll.querySelector('[data-id="' + target.id + '"]');
      if (el) el.scrollIntoView({ block: "nearest" });
    }

    function pickRandom() {
      const pool = state.filtered.length ? state.filtered : RELEASES;
      const pick = pool[Math.floor(Math.random() * pool.length)];
      if (!pick) return;
      const idx = state.filtered.findIndex((r) => r.id === pick.id);
      if (idx >= state.visibleLimit) {
        state.visibleLimit = idx + 36;
        renderCatalog();
      }
      renderDetail(pick);
      const el = dom.catalogScroll.querySelector('[data-id="' + pick.id + '"]');
      if (el) el.scrollIntoView({ block: "center" });
    }

    function resetFilters() {
      state.query = "";
      state.artist = "ALL";
      state.year = "ALL";
      state.doomOnly = false;
      state.savedOnly = false;
      state.visibleLimit = 72;
      dom.searchInput.value = "";
      dom.artistSelect.value = "ALL";
      dom.yearSelect.value = "ALL";
      dom.savedFilterBtn.classList.remove("active");
      renderRosterBar();
      computeFiltered();
      renderCatalog();
      dom.catalogScroll.scrollTop = 0;
    }

    /* COVER WALL */
    function renderWall() {
      const list = state.filtered.length ? state.filtered : RELEASES;
      const slice = list.slice(0, state.wallLimit);
      dom.wallSub.textContent = slice.length + " of " + list.length + " sleeves";
      dom.wallGrid.innerHTML = slice
        .map(
          (r) =>
            '<button type="button" class="wall-tile" data-wall-id="' + r.id + '">' +
              '<img src="' + artUrl(r.artId, 16) + '" alt="' + esc(r.artist + " - " + r.title) + '" loading="lazy" referrerpolicy="no-referrer" />' +
              '<div class="wall-caption"><strong>' + esc(r.artist) + '</strong><span>' + esc(r.title) + '</span></div>' +
            '</button>'
        )
        .join("");

      if (list.length > slice.length) {
        dom.wallMoreWrap.innerHTML =
          '<button type="button" class="load-more-btn" id="wallMoreBtn">Load More Covers (' + (list.length - slice.length) + ' remaining)</button>';
        document.getElementById("wallMoreBtn").addEventListener("click", () => {
          state.wallLimit += 120;
          renderWall();
        });
      } else {
        dom.wallMoreWrap.innerHTML = "";
      }
    }

    function openWall() {
      state.wallLimit = 120;
      renderWall();
      dom.wallModal.classList.add("open");
    }
    function closeWall() {
      dom.wallModal.classList.remove("open");
    }

    /* LIGHTBOX */
    function openLightbox(item) {
      if (!item) return;
      dom.lightboxImg.src = artUrl(item.artId, 10);
      dom.lightboxImg.alt = item.artist + " — " + item.title;
      dom.lightboxArtist.textContent = item.artist;
      dom.lightboxCaption.textContent = item.title + (item.year ? " · " + item.year : "") + " · Heavy Psych Sounds";
      dom.lightbox.classList.add("open");
    }
    function closeLightbox() {
      dom.lightbox.classList.remove("open");
    }

    /* 1970s PSYCHEDELIC LIQUID OIL-PROJECTOR CANVAS (Nebula / Black Rainbows visual motif) */
    let oilPulse = 0;
    let oilPhase = 0;
    let oilRaf = null;

    function pulseOil(amount) {
      oilPulse = Math.min(2.2, oilPulse + (amount || 0.8));
      if (!state.oilOn) drawOilFrame(oilPhase);
    }

    function drawOilFrame(t) {
      const canvas = dom.oilCanvas;
      if (!canvas) return;
      const ctx = canvas.getContext("2d");
      if (!ctx) return;
      const w = canvas.width;
      const h = canvas.height;
      const cfg = INK_CONFIG[state.ink] || INK_CONFIG["acid-foil"];
      const [c1, c2, c3, bg] = cfg.colors;

      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, w, h);

      // Marbled psychedelic oil blobs
      const blobs = [
        { x: 0.22 + Math.sin(t * 0.7) * 0.14, y: 0.5 + Math.cos(t * 0.9) * 0.22, r: 95 + oilPulse * 24, col: c3, a: 0.92 },
        { x: 0.52 + Math.cos(t * 0.6) * 0.18, y: 0.48 + Math.sin(t * 0.8) * 0.25, r: 82 + oilPulse * 20, col: c2, a: 0.65 },
        { x: 0.78 + Math.sin(t * 0.85 + 1.4) * 0.15, y: 0.52 + Math.cos(t * 0.75) * 0.22, r: 76 + oilPulse * 18, col: c1, a: 0.72 },
        { x: 0.38 + Math.sin(t * 1.1 + 2.2) * 0.2, y: 0.5 + Math.cos(t * 0.65 + 1.1) * 0.24, r: 58 + oilPulse * 14, col: c1, a: 0.52 }
      ];

      ctx.save();
      ctx.globalCompositeOperation = "screen";
      for (const b of blobs) {
        const gx = b.x * w;
        const gy = b.y * h;
        const grad = ctx.createRadialGradient(gx, gy, 4, gx, gy, b.r);
        grad.addColorStop(0, b.col);
        grad.addColorStop(0.55, b.col + "66");
        grad.addColorStop(1, "transparent");
        ctx.globalAlpha = b.a;
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(gx, gy, b.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

      // Silkscreen halftone dot matrix overlay
      ctx.fillStyle = "rgba(14, 11, 12, 0.28)";
      for (let y = 4; y < h; y += 8) {
        for (let x = (y % 16 === 0 ? 4 : 8); x < w; x += 8) {
          ctx.fillRect(x, y, 2, 2);
        }
      }
    }

    function tickOil() {
      if (!state.oilOn) {
        oilRaf = null;
        return;
      }
      oilPhase += 0.016 + oilPulse * 0.012;
      oilPulse *= 0.94;
      drawOilFrame(oilPhase);
      oilRaf = requestAnimationFrame(tickOil);
    }

    function syncOilButton() {
      dom.oilToggleBtn.textContent = state.oilOn ? "Oil Light: On" : "Oil Light: Off";
      dom.oilToggleBtn.setAttribute("aria-pressed", String(state.oilOn));
      if (state.oilOn && !oilRaf) tickOil();
      if (!state.oilOn) {
        if (oilRaf) cancelAnimationFrame(oilRaf);
        oilRaf = null;
        drawOilFrame(oilPhase);
      }
    }

    /* EVENT WIRING */
    dom.oilToggleBtn.addEventListener("click", () => {
      state.oilOn = !state.oilOn;
      syncOilButton();
    });

    document.querySelectorAll(".ink-btn").forEach((btn) => {
      btn.addEventListener("click", () => applyInk(btn.dataset.ink, true));
    });

    dom.rosterBar.addEventListener("click", (e) => {
      const btn = e.target.closest(".roster-btn");
      if (!btn) return;
      const val = btn.dataset.roster;
      if (val === "ALL") {
        state.artist = "ALL";
        state.doomOnly = false;
        dom.artistSelect.value = "ALL";
      } else if (val === "DOOM") {
        state.doomOnly = !state.doomOnly;
        if (state.doomOnly) {
          state.artist = "ALL";
          dom.artistSelect.value = "ALL";
        }
      } else {
        state.doomOnly = false;
        state.artist = state.artist === val ? "ALL" : val;
        dom.artistSelect.value = state.artist;
      }
      state.visibleLimit = 72;
      renderRosterBar();
      computeFiltered();
      renderCatalog();
      dom.catalogScroll.scrollTop = 0;
    });

    let searchTimer = null;
    dom.searchInput.addEventListener("input", () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        state.query = dom.searchInput.value;
        state.visibleLimit = 72;
        computeFiltered();
        renderCatalog();
        dom.catalogScroll.scrollTop = 0;
      }, 90);
    });

    dom.searchClear.addEventListener("click", () => {
      dom.searchInput.value = "";
      state.query = "";
      state.visibleLimit = 72;
      computeFiltered();
      renderCatalog();
      dom.searchInput.focus();
    });

    dom.artistSelect.addEventListener("change", () => {
      state.artist = dom.artistSelect.value;
      state.doomOnly = false;
      state.visibleLimit = 72;
      renderRosterBar();
      computeFiltered();
      renderCatalog();
      dom.catalogScroll.scrollTop = 0;
    });

    dom.yearSelect.addEventListener("change", () => {
      state.year = dom.yearSelect.value;
      state.visibleLimit = 72;
      computeFiltered();
      renderCatalog();
      dom.catalogScroll.scrollTop = 0;
    });

    dom.sortSelect.addEventListener("change", () => {
      state.sort = dom.sortSelect.value;
      state.visibleLimit = 72;
      computeFiltered();
      renderCatalog();
      dom.catalogScroll.scrollTop = 0;
    });

    dom.viewRackBtn.addEventListener("click", () => {
      state.view = "rack";
      dom.viewRackBtn.classList.add("active");
      dom.viewListBtn.classList.remove("active");
      renderCatalog();
    });

    dom.viewListBtn.addEventListener("click", () => {
      state.view = "list";
      dom.viewListBtn.classList.add("active");
      dom.viewRackBtn.classList.remove("active");
      renderCatalog();
    });

    dom.resetBtn.addEventListener("click", resetFilters);

    dom.savedFilterBtn.addEventListener("click", () => {
      state.savedOnly = !state.savedOnly;
      dom.savedFilterBtn.classList.toggle("active", state.savedOnly);
      state.visibleLimit = 72;
      computeFiltered();
      renderCatalog();
      dom.catalogScroll.scrollTop = 0;
    });

    dom.randomBtn.addEventListener("click", pickRandom);
    dom.coverWallBtn.addEventListener("click", openWall);
    dom.wallCloseBtn.addEventListener("click", closeWall);

    dom.wallGrid.addEventListener("click", (e) => {
      const tile = e.target.closest(".wall-tile");
      if (!tile) return;
      const target = BY_ID.get(Number(tile.dataset.wallId));
      if (target) {
        closeWall();
        renderDetail(target);
      }
    });

    dom.lbCloseBtn.addEventListener("click", closeLightbox);
    dom.lightbox.addEventListener("click", (e) => {
      if (e.target === dom.lightbox) closeLightbox();
    });
    dom.lbPrevBtn.addEventListener("click", () => {
      stepSelection(-1);
      openLightbox(BY_ID.get(state.selectedId));
    });
    dom.lbNextBtn.addEventListener("click", () => {
      stepSelection(1);
      openLightbox(BY_ID.get(state.selectedId));
    });

    dom.catalogScroll.addEventListener("click", (e) => {
      const card = e.target.closest("[data-id]");
      if (!card) return;
      const item = BY_ID.get(Number(card.dataset.id));
      if (item) renderDetail(item);
    });

    dom.catalogScroll.addEventListener("scroll", () => {
      updateActiveAzLetter();
    }, { passive: true });

    // Vertical A–Z Rail click + pointer drag scrubbing
    let azDragging = false;
    function scrubAzAt(clientY) {
      const rect = dom.azRail.getBoundingClientRect();
      const ratio = Math.max(0, Math.min(0.999, (clientY - rect.top) / rect.height));
      const buttons = dom.azRail.querySelectorAll(".az-btn");
      const target = buttons[Math.floor(ratio * buttons.length)];
      if (target && !target.disabled) {
        jumpToLetter(target.dataset.letter);
      }
    }

    dom.azRail.addEventListener("pointerdown", (e) => {
      azDragging = true;
      dom.azRail.setPointerCapture(e.pointerId);
      scrubAzAt(e.clientY);
    });
    dom.azRail.addEventListener("pointermove", (e) => {
      if (!azDragging) return;
      scrubAzAt(e.clientY);
    });
    dom.azRail.addEventListener("pointerup", () => { azDragging = false; });
    dom.azRail.addEventListener("pointercancel", () => { azDragging = false; });

    document.addEventListener("keydown", (e) => {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const tag = (document.activeElement && document.activeElement.tagName || "").toLowerCase();
      if (e.key === "Escape") {
        if (dom.lightbox.classList.contains("open")) return closeLightbox();
        if (dom.wallModal.classList.contains("open")) return closeWall();
        if (tag === "input") document.activeElement.blur();
        return;
      }
      if (tag === "input" || tag === "select" || tag === "textarea") return;

      if (e.key === "/") {
        e.preventDefault();
        dom.searchInput.focus();
      } else if (e.key === "l" || e.key === "L") {
        if (state.view === "rack") dom.viewListBtn.click();
        else dom.viewRackBtn.click();
      } else if (e.key === "w" || e.key === "W") {
        if (dom.wallModal.classList.contains("open")) closeWall();
        else openWall();
      } else if (e.key === "r" || e.key === "R") {
        pickRandom();
      } else if (e.key === "f" || e.key === "F") {
        dom.savedFilterBtn.click();
      } else if (e.key === "ArrowRight") {
        stepSelection(1);
        if (dom.lightbox.classList.contains("open")) openLightbox(BY_ID.get(state.selectedId));
      } else if (e.key === "ArrowLeft") {
        stepSelection(-1);
        if (dom.lightbox.classList.contains("open")) openLightbox(BY_ID.get(state.selectedId));
      }
    });

    /* INIT */
    applyInk(state.ink, false);
    saveFavs();
    populateDropdowns();
    renderRosterBar();
    computeFiltered();

    // Pick iconic Black Rainbows Superskull or first release as default inspected item
    const featured =
      RELEASES.find((r) => r.artist === "Black Rainbows" && /superskull/i.test(r.title)) ||
      RELEASES.find((r) => r.artist === "Acid Mammoth") ||
      state.filtered[0];

    renderCatalog();
    renderDetail(featured);
    syncOilButton();
  </script>
  <script src="./mobile-adapt.js" defer></script>
<script src="./now-playing-dock.js" defer></script>
  <script src="./chrome-cast.js" defer></script>
</body>
</html>
