<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Wings Of An Angel · Illuminated Triptych Archive (923 Bandcamp Releases)</title>
<meta name="description" content="Hieronymus Bosch triptych and Flemish oil-panel Bandcamp player housing 923 Wings Of An Angel releases (2012–2026) with year sorting, thematic filters, progressive Cover Wall, Favorites, Recently Played, and official embeds.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  /* Flemish oil-on-oak & Boschian nocturnal triptych pigments */
  --nocturne: #090b10;
  --panel: rgba(15, 17, 23, 0.88);
  --panel-strong: rgba(11, 13, 18, 0.94);
  --oak-rule: rgba(221, 181, 99, 0.18);
  --oak-rule-strong: rgba(221, 181, 99, 0.36);

  --gilt: #ddb563;
  --gilt-hi: #f0cf84;
  --lapis: #5d95cb;
  --cinnabar: #c94c3e;
  --verdigris: #5f9e85;

  --vellum: #f0e8d8;
  --vellum-soft: #c5baa4;
  --umber-dim: #857c6c;

  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  --font-display: 'Cormorant Garamond', Georgia, serif;
  --font-body: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: 'IBM Plex Mono', monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: var(--nocturne);
  color: var(--vellum);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

button, input, select, a { font-family: inherit; }

:focus-visible {
  outline: 2px solid var(--gilt);
  outline-offset: 2px;
}

/* FULL-BLEED ILLUMINATED PANEL COVER-ART COLLAGE BACKDROP */
.collage-bg {
  position: fixed;
  inset: -42px;
  z-index: 0;
  overflow: hidden;
  pointer-events: none;
}
.collage-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 5px;
  width: calc(100% + 84px);
  height: calc(100% + 84px);
  filter: blur(5px) sepia(0.24) contrast(1.14) brightness(0.27);
  animation: panelDrift 50s ease-in-out infinite alternate;
  transform-origin: center;
  will-change: transform;
}
@media (max-width: 900px) {
  .collage-grid { grid-template-columns: repeat(5, 1fr); }
}
.collage-tile {
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: cover;
  opacity: 0.9;
  background: #11141c;
}

/* Active album oil-glaze chiaroscuro bloom */
.active-bloom {
  position: fixed;
  inset: -60px;
  z-index: 1;
  pointer-events: none;
  background-size: cover;
  background-position: center;
  filter: blur(78px) saturate(1.22) brightness(0.27);
  opacity: 0.56;
  transition: background-image 0.8s ease;
}

/* Lapis & candlelight triptych glaze + fine linen craquelure grain */
.triptych-veil {
  position: fixed;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  background:
    radial-gradient(ellipse 68% 54% at 18% 12%, rgba(93, 149, 203, 0.14), transparent 64%),
    radial-gradient(ellipse 62% 50% at 84% 84%, rgba(201, 76, 62, 0.13), transparent 64%),
    radial-gradient(ellipse 50% 44% at 50% 0%, rgba(221, 181, 99, 0.10), transparent 60%),
    radial-gradient(ellipse at center, rgba(9, 11, 16, 0.42) 20%, rgba(5, 6, 9, 0.92) 100%);
}
.triptych-veil::after {
  content: '';
  position: absolute;
  inset: 0;
  opacity: 0.105;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='1.0' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  mix-blend-mode: overlay;
}

@keyframes panelDrift {
  0% { transform: translate3d(-10px, -8px, 0) scale(1.04); }
  100% { transform: translate3d(14px, 10px, 0) scale(1.09); }
}

@keyframes fadeRise {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (prefers-reduced-motion: reduce) {
  .collage-grid { animation: none; }
  *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
}

/* HEADER */
.header {
  position: relative;
  z-index: 20;
  padding: 14px 28px;
  background: var(--panel-strong);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border-bottom: 1px solid var(--oak-rule);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
}
.header::after {
  content: '';
  position: absolute;
  left: 0;
  right: 0;
  bottom: -1px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--lapis), var(--gilt), var(--cinnabar), transparent);
  opacity: 0.8;
}

.brand-wrap {
  display: flex;
  align-items: center;
  gap: 14px;
  min-width: 0;
}

/* Pointed Gothic arch & Boschian winged-sphere emblem */
.triptych-crest {
  width: 44px;
  height: 44px;
  border: 1px solid var(--oak-rule-strong);
  border-radius: 22px 22px 3px 3px;
  background: radial-gradient(circle at 50% 35%, rgba(221, 181, 99, 0.16), rgba(93, 149, 203, 0.08) 70%);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  color: var(--gilt);
}

.brand {
  font-family: var(--font-display);
  font-size: clamp(26px, 3vw, 36px);
  font-weight: 700;
  line-height: 0.96;
  letter-spacing: 0.01em;
  color: var(--vellum);
  white-space: nowrap;
}

.subbrand {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--umber-dim);
  margin-top: 4px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.header-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}

.back-link {
  color: var(--vellum-soft);
  text-decoration: none;
  font-size: 13px;
  font-weight: 500;
  padding: 6px 4px;
  margin-right: 6px;
  white-space: nowrap;
  flex-shrink: 0;
  border-bottom: 1px solid transparent;
  transition: color 0.15s var(--ease), border-color 0.15s var(--ease);
}
.back-link:hover {
  color: var(--vellum);
  border-bottom-color: var(--gilt);
}

.altar-btn {
  background: rgba(18, 20, 28, 0.9);
  color: var(--vellum);
  border: 1px solid var(--oak-rule);
  border-radius: 2px;
  padding: 8px 13px;
  min-height: 38px;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 500;
  cursor: pointer;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
  flex-shrink: 0;
  transition: border-color 0.16s var(--ease), background 0.16s var(--ease), color 0.16s var(--ease), transform 0.16s var(--ease);
}
.altar-btn:hover {
  border-color: var(--gilt);
  background: rgba(221, 181, 99, 0.14);
  color: #fff;
  transform: translateY(-1px);
}
.altar-btn.primary {
  background: var(--gilt);
  border-color: var(--gilt);
  color: #0b0d12;
  font-weight: 600;
}
.altar-btn.primary:hover {
  background: var(--gilt-hi);
  border-color: var(--gilt-hi);
  color: #07080b;
}
.altar-btn.active {
  background: rgba(201, 76, 62, 0.24);
  border-color: var(--cinnabar);
  color: #fff;
}
.altar-btn .count-num {
  font-variant-numeric: tabular-nums;
  color: var(--gilt);
  font-weight: 600;
}
.altar-btn.active .count-num,
.altar-btn.primary .count-num {
  color: inherit;
}

/* MAIN SPLIT LAYOUT */
.app {
  position: relative;
  z-index: 10;
  display: grid;
  grid-template-columns: 420px 1fr;
  min-height: calc(100vh - 76px);
}
.app.hidden { display: none; }

@media (max-width: 980px) {
  .header { padding: 12px 16px; }
  .app { grid-template-columns: 1fr; }
}

/* SIDEBAR CATALOG (LEFT WING OF THE TRIPTYCH) */
.sidebar {
  background: var(--panel);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-right: 1px solid var(--oak-rule);
  display: flex;
  flex-direction: column;
  max-height: calc(100vh - 76px);
  overflow: hidden;
}
@media (max-width: 980px) {
  .sidebar {
    max-height: 52vh;
    border-right: none;
    border-bottom: 1px solid var(--oak-rule);
  }
}

.sidebar-controls {
  padding: 14px 15px 12px;
  border-bottom: 1px solid var(--oak-rule);
  background: rgba(10, 12, 17, 0.88);
  display: flex;
  flex-direction: column;
  gap: 9px;
}

.scope-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--umber-dim);
  font-variant-numeric: tabular-nums;
}
.scope-row .count-hi {
  color: var(--gilt);
  font-weight: 600;
}

.search-input {
  width: 100%;
  background: rgba(16, 18, 25, 0.95);
  border: 1px solid var(--oak-rule);
  border-radius: 2px;
  color: var(--vellum);
  padding: 9px 12px;
  font-size: 13.5px;
  transition: border-color 0.15s var(--ease);
}
.search-input::placeholder { color: var(--umber-dim); }
.search-input:focus {
  outline: none;
  border-color: var(--gilt);
}

.controls-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.select-input {
  width: 100%;
  background: rgba(16, 18, 25, 0.95);
  border: 1px solid var(--oak-rule);
  border-radius: 2px;
  color: var(--vellum-soft);
  padding: 7px 9px;
  font-family: var(--font-mono);
  font-size: 11px;
  cursor: pointer;
}
.select-input:focus {
  outline: none;
  border-color: var(--gilt);
  color: var(--vellum);
}

/* Thematic Motif Filter Strip */
.motif-filters {
  display: flex;
  gap: 5px;
  overflow-x: auto;
  padding-bottom: 2px;
  scrollbar-width: thin;
}
.motif-btn {
  background: rgba(18, 21, 29, 0.88);
  border: 1px solid var(--oak-rule);
  border-radius: 2px;
  color: var(--vellum-soft);
  padding: 5px 9px;
  font-family: var(--font-mono);
  font-size: 10.5px;
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
  transition: background 0.15s var(--ease), color 0.15s var(--ease), border-color 0.15s var(--ease);
}
.motif-btn:hover {
  border-color: var(--oak-rule-strong);
  color: var(--vellum);
}
.motif-btn.active {
  background: var(--gilt);
  border-color: var(--gilt);
  color: #090b10;
  font-weight: 600;
}

.sidebar-tools {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding-top: 2px;
}
.sidebar-tools-label {
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--umber-dim);
}
.view-segmented {
  display: inline-flex;
  border: 1px solid var(--oak-rule);
  border-radius: 2px;
  overflow: hidden;
}
.mini-toggle {
  background: transparent;
  border: none;
  color: var(--umber-dim);
  padding: 5px 10px;
  font-family: var(--font-mono);
  font-size: 10.5px;
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.15s, color 0.15s;
}
.mini-toggle:hover { color: var(--vellum); }
.mini-toggle.active {
  background: var(--gilt);
  color: #090b10;
  font-weight: 600;
}

/* ALBUM LIST */
.album-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px 10px 18px;
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.album-list.mini-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  align-content: start;
  padding: 10px;
}

.row {
  display: grid;
  grid-template-columns: 50px 1fr 32px;
  align-items: center;
  gap: 11px;
  padding: 7px 9px;
  background: rgba(15, 18, 25, 0.58);
  border: 1px solid transparent;
  border-radius: 2px;
  cursor: pointer;
  transition: background 0.15s var(--ease), border-color 0.15s var(--ease), transform 0.15s var(--ease);
}
.row:hover {
  background: rgba(24, 28, 38, 0.9);
  border-color: var(--oak-rule);
  transform: translateX(2px);
}
.row.active {
  background: rgba(221, 181, 99, 0.14);
  border-color: var(--gilt);
}

.thumb {
  width: 50px;
  height: 50px;
  object-fit: cover;
  display: block;
  border: 1px solid var(--oak-rule);
  border-radius: 2px;
  background: #11141c;
}

.info { min-width: 0; }
.row-title {
  font-family: var(--font-display);
  font-size: 17px;
  font-weight: 700;
  line-height: 1.15;
  color: var(--vellum);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.row.active .row-title { color: #fff; }
.row-meta {
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--umber-dim);
  margin-top: 3px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.fav-star {
  width: 32px;
  height: 32px;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 2px;
  color: var(--umber-dim);
  font-size: 15px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: color 0.15s, border-color 0.15s, transform 0.15s;
}
.fav-star:hover {
  color: var(--cinnabar);
  border-color: var(--oak-rule);
  transform: scale(1.08);
}
.fav-star.saved { color: var(--cinnabar); }

.grid-tile {
  position: relative;
  aspect-ratio: 1 / 1;
  border: 1px solid var(--oak-rule);
  border-radius: 2px;
  overflow: hidden;
  cursor: pointer;
  background: #11141c;
  transition: transform 0.16s var(--ease), border-color 0.16s var(--ease);
}
.grid-tile:hover {
  transform: translateY(-2px);
  border-color: var(--gilt);
}
.grid-tile.active {
  border-color: var(--cinnabar);
  box-shadow: 0 0 0 1px var(--cinnabar);
}
.grid-tile img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.grid-tile-cap {
  position: absolute;
  inset: auto 0 0 0;
  padding: 18px 6px 5px;
  background: linear-gradient(180deg, transparent, rgba(7, 8, 12, 0.96));
  font-size: 10.5px;
  color: var(--vellum);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.load-more-wrap {
  grid-column: 1 / -1;
  display: flex;
  gap: 8px;
  padding: 10px 2px 4px;
}
.load-more-btn {
  flex: 1;
  background: rgba(18, 21, 29, 0.92);
  border: 1px solid var(--oak-rule-strong);
  border-radius: 2px;
  color: var(--gilt);
  padding: 9px 12px;
  font-family: var(--font-mono);
  font-size: 11px;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
}
.load-more-btn:hover {
  background: rgba(221, 181, 99, 0.14);
  border-color: var(--gilt);
}

/* DETAIL STAGE (CENTRAL ALTARPIECE PANEL) */
.detail {
  overflow-y: auto;
  max-height: calc(100vh - 76px);
  padding: 24px 30px 48px;
}
@media (max-width: 980px) {
  .detail { max-height: none; padding: 18px 16px 40px; }
}

.detail-stage {
  max-width: 1060px;
  margin: 0 auto;
  animation: fadeRise 0.24s var(--ease);
}

/* RECENTLY PLAYED STRIP */
.history-strip {
  margin-bottom: 18px;
  padding: 12px 14px;
  background: var(--panel);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--oak-rule);
  border-radius: 2px;
}
.history-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 9px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--umber-dim);
  font-variant-numeric: tabular-nums;
}
.history-clear {
  background: transparent;
  border: none;
  color: var(--vellum-soft);
  font-family: var(--font-mono);
  font-size: 11px;
  cursor: pointer;
  border-bottom: 1px solid transparent;
  transition: color 0.15s, border-color 0.15s;
}
.history-clear:hover {
  color: var(--cinnabar);
  border-bottom-color: var(--cinnabar);
}
.history-items {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 2px;
}
.history-chip {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 10px 5px 5px;
  background: rgba(13, 16, 22, 0.9);
  border: 1px solid var(--oak-rule);
  border-radius: 2px;
  cursor: pointer;
  flex-shrink: 0;
  max-width: 225px;
  transition: border-color 0.15s, background 0.15s;
}
.history-chip:hover {
  border-color: var(--oak-rule-strong);
  background: rgba(21, 25, 34, 0.95);
}
.history-chip.active {
  border-color: var(--gilt);
  background: rgba(221, 181, 99, 0.14);
}
.history-chip img {
  width: 34px;
  height: 34px;
  object-fit: cover;
  display: block;
  background: #11141c;
  flex-shrink: 0;
}
.history-chip-text { min-width: 0; }
.history-chip-title {
  font-size: 12.5px;
  font-weight: 600;
  color: var(--vellum);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.history-chip-year {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--umber-dim);
  font-variant-numeric: tabular-nums;
}

/* HERO ALTARPIECE PANEL — Double gilt hairline frame */
.hero-card {
  position: relative;
  display: grid;
  grid-template-columns: 244px 1fr;
  gap: 26px;
  align-items: start;
  padding: 24px;
  background: var(--panel-strong);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--oak-rule-strong);
  outline: 1px solid rgba(221, 181, 99, 0.10);
  outline-offset: -6px;
  border-radius: 2px;
  margin-bottom: 18px;
}
@media (max-width: 740px) {
  .hero-card {
    grid-template-columns: 1fr;
    gap: 16px;
    padding: 18px;
  }
}

.hero-art-wrap {
  position: relative;
  padding: 6px;
  background: rgba(7, 9, 13, 0.9);
  border: 1px solid var(--oak-rule-strong);
  box-shadow: 0 18px 40px rgba(0, 0, 0, 0.7);
}
.hero-art {
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: cover;
  display: block;
  background: #11141c;
}

.hero-content {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.hero-meta-line {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--vellum-soft);
  font-variant-numeric: tabular-nums;
}
.hero-meta-line .folio-num {
  color: var(--gilt);
  font-weight: 600;
}
.hero-meta-line .sep {
  color: var(--umber-dim);
}

.hero-title {
  font-family: var(--font-display);
  font-size: clamp(28px, 3.6vw, 44px);
  font-weight: 700;
  line-height: 1.08;
  color: #fff;
  text-wrap: balance;
}
.hero-title.long-prose {
  font-size: clamp(22px, 2.5vw, 31px);
  line-height: 1.18;
  font-style: italic;
}

.hero-sub {
  font-size: 14px;
  color: var(--vellum-soft);
}
.hero-sub strong {
  color: var(--lapis);
  font-weight: 600;
}

.hero-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
  padding-top: 6px;
}

/* LISTENING DECK SPLIT */
.deck-grid {
  display: grid;
  grid-template-columns: minmax(320px, 1.05fr) minmax(290px, 0.95fr);
  gap: 18px;
  align-items: start;
}
@media (max-width: 1060px) {
  .deck-grid { grid-template-columns: 1fr; }
}

.iframe-shell {
  background: var(--panel-strong);
  border: 1px solid var(--oak-rule);
  border-radius: 2px;
  padding: 12px;
  min-height: 496px;
  display: flex;
  flex-direction: column;
}
.iframe-shell iframe {
  width: 100%;
  flex: 1;
  min-height: 472px;
  border: 0;
  background: #0b0d12;
}

.companion-card {
  background: var(--panel);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border: 1px solid var(--oak-rule);
  border-radius: 2px;
  padding: 18px 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.card-kicker {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--gilt);
}

.mini-collage {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.mini-collage-item {
  position: relative;
  aspect-ratio: 1 / 1;
  border: 1px solid var(--oak-rule);
  border-radius: 2px;
  overflow: hidden;
  cursor: pointer;
  background: #11141c;
  transition: transform 0.16s var(--ease), border-color 0.16s var(--ease);
}
.mini-collage-item:hover {
  transform: translateY(-2px);
  border-color: var(--gilt);
}
.mini-collage-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.mini-collage-item span {
  position: absolute;
  inset: auto 0 0 0;
  padding: 16px 6px 5px;
  background: linear-gradient(180deg, transparent, rgba(7, 8, 12, 0.95));
  font-size: 11px;
  color: var(--vellum);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.artist-epigraph {
  font-family: var(--font-display);
  font-size: 17px;
  font-style: italic;
  line-height: 1.45;
  color: var(--vellum);
  padding: 12px 0;
  border-top: 1px solid var(--oak-rule);
  border-bottom: 1px solid var(--oak-rule);
}

.field-note {
  font-size: 13.5px;
  color: var(--vellum-soft);
  line-height: 1.55;
}
.field-note strong {
  color: var(--vellum);
  font-weight: 600;
}

.era-action-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

/* PREV / NEXT NAV BAR */
.detail-nav {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 18px;
}
@media (max-width: 600px) {
  .detail-nav { grid-template-columns: 1fr; }
}
.nav-btn {
  background: var(--panel);
  border: 1px solid var(--oak-rule);
  border-radius: 2px;
  color: var(--vellum);
  padding: 12px 16px;
  cursor: pointer;
  text-align: left;
  transition: border-color 0.15s var(--ease), background 0.15s var(--ease), transform 0.15s var(--ease);
}
.nav-btn:hover:not(:disabled) {
  border-color: var(--gilt);
  background: rgba(221, 181, 99, 0.11);
  transform: translateY(-1px);
}
.nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.nav-btn.next { text-align: right; }
.nav-btn small {
  display: block;
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--gilt);
  margin-bottom: 4px;
}
.nav-btn span {
  display: block;
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.kbd-bar {
  margin-top: 14px;
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--umber-dim);
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
}

/* FULL COVER WALL VIEW */
.wall-view {
  position: relative;
  z-index: 12;
  display: none;
  padding: 20px 26px 64px;
  max-width: 1520px;
  margin: 0 auto;
}
.wall-view.open { display: block; }

.wall-header {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 18px;
  padding: 14px 20px;
  background: var(--panel-strong);
  border: 1px solid var(--oak-rule-strong);
  border-radius: 2px;
}
.wall-title {
  font-family: var(--font-display);
  font-size: 24px;
  font-weight: 700;
  color: var(--vellum);
}
.wall-sub {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--umber-dim);
  font-variant-numeric: tabular-nums;
}

.wall-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(156px, 1fr));
  gap: 10px;
}
.wall-card {
  position: relative;
  aspect-ratio: 1 / 1;
  border-radius: 2px;
  overflow: hidden;
  cursor: pointer;
  border: 1px solid var(--oak-rule);
  background: #11141c;
  transition: transform 0.18s var(--ease), border-color 0.18s var(--ease), box-shadow 0.18s var(--ease);
}
.wall-card:hover {
  transform: translateY(-3px) scale(1.02);
  border-color: var(--gilt);
  box-shadow: 0 12px 24px rgba(0, 0, 0, 0.72);
  z-index: 3;
}
.wall-card.active {
  border-color: var(--cinnabar);
  box-shadow: 0 0 0 1px var(--cinnabar);
}
.wall-card img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.wall-cap {
  position: absolute;
  inset: auto 0 0 0;
  padding: 24px 8px 7px;
  background: linear-gradient(180deg, transparent, rgba(7, 8, 12, 0.96));
}
.wall-cap-title {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 14px;
  color: var(--vellum);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.wall-cap-year {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--gilt);
  font-variant-numeric: tabular-nums;
}

/* TOAST */
.toast {
  position: fixed;
  bottom: 22px;
  right: 22px;
  background: #10131a;
  border: 1px solid var(--gilt);
  border-radius: 2px;
  color: var(--vellum);
  padding: 10px 16px;
  font-family: var(--font-mono);
  font-size: 11.5px;
  z-index: 300;
  opacity: 0;
  transform: translateY(10px);
  pointer-events: none;
  transition: opacity 0.2s var(--ease), transform 0.2s var(--ease);
}
.toast.show { opacity: 1; transform: translateY(0); }

/* SCROLLBARS */
::-webkit-scrollbar { width: 8px; height: 6px; }
::-webkit-scrollbar-track { background: #090b10; }
::-webkit-scrollbar-thumb { background: rgba(221, 181, 99, 0.24); }
::-webkit-scrollbar-thumb:hover { background: var(--gilt); }
</style>
</head>

const BASE_URL = "https://wingsofanangel.bandcamp.com";
const ALBUMS = RAW.map(r => ({
  idx: r[0],
  id: r[1],
  artId: r[2],
  title: r[3],
  url: BASE_URL + r[4],
  year: r[5],
  iso: r[6],
  thumb: `https://f4.bcbits.com/img/a${r[2]}_9.jpg`,
  cover: `https://f4.bcbits.com/img/a${r[2]}_16.jpg`
}));

const YEAR_COUNTS = {};
ALBUMS.forEach(a => {
  if (a.year) YEAR_COUNTS[a.year] = (YEAR_COUNTS[a.year] || 0) + 1;
});

const MOTIFS = [
  { key: "ALL", label: "All", test: () => true },
  { key: "PROSE", label: "Prose Titles", test: a => a.title.length >= 70 },
  { key: "SERIES", label: "Volumes & Parts", test: a => /\b(vol\.?|volume|part|pt\.?)\b/i.test(a.title) },
  { key: "SACRED", label: "God & Angels", test: a => /god|angel|heaven|hell|saint|psalm|hymn|prayer|requiem|sin|devil|mercy/i.test(a.title) },
  { key: "NOCTURNE", label: "Night & Shadow", test: a => /night|dark|shadow|moon|ghost|silence|silent|dream/i.test(a.title) },
  { key: "LOVE", label: "Love & Grief", test: a => /love|heart|grief|lament|sorrow|tears|mercy|soul/i.test(a.title) },
  { key: "ELEMENTS", label: "Rain, Fire & Sea", test: a => /rain|fire|sea|water|sun|storm|star|sky|ocean/i.test(a.title) },
  { key: "LIVE", label: "Live & Demos", test: a => /\b(live|demo|session|rehearsal|split)\b/i.test(a.title) }
];

const PAGE_SIZE = 80;
const WALL_PAGE_SIZE = 120;
const STORAGE_FAVS = "woaa_triptych_favs_v1";
const STORAGE_HIST = "woaa_triptych_hist_v1";

const state = {
  search: "",
  sortBy: "newest",
  yearFilter: "ALL",
  motif: "ALL",
  favoritesOnly: false,
  sidebarMode: "list",
  wallOpen: false,
  currentIdx: 1,
  listLimit: PAGE_SIZE,
  wallLimit: WALL_PAGE_SIZE,
  favorites: new Set(),
  history: []
};

const $ = id => document.getElementById(id);

function loadStorage() {
  try {
    const rawFavs = localStorage.getItem(STORAGE_FAVS);
    if (rawFavs) JSON.parse(rawFavs).forEach(n => state.favorites.add(Number(n)));
    const rawHist = localStorage.getItem(STORAGE_HIST);
    if (rawHist) {
      const parsed = JSON.parse(rawHist);
      if (Array.isArray(parsed)) {
        state.history = parsed.map(Number).filter(n => n >= 1 && n <= ALBUMS.length).slice(0, 14);
      }
    }
  } catch (_) {}
}

function saveStorage() {
  try {
    localStorage.setItem(STORAGE_FAVS, JSON.stringify([...state.favorites]));
    localStorage.setItem(STORAGE_HIST, JSON.stringify(state.history));
  } catch (_) {}
}

function recordHistory(idx) {
  const n = Number(idx);
  state.history = [n, ...state.history.filter(x => x !== n)].slice(0, 14);
  saveStorage();
}

function escapeHtml(s) {
  if (s == null) return "";
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function formatDate(iso) {
  if (!iso) return "";
  const parts = iso.split("-");
  if (parts.length !== 3) return iso;
  const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const m = months[Number(parts[1]) - 1] || parts[1];
  return `${m} ${Number(parts[2])}, ${parts[0]}`;
}

let toastTimer = null;
function showToast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2400);
}

function fisherYates(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildBackdropCollage() {
  const sample = fisherYates(ALBUMS).slice(0, 48);
  $("collageGrid").innerHTML = sample.map(a =>
    `<img class="collage-tile" src="${a.thumb}" alt="" loading="lazy" referrerpolicy="no-referrer">`
  ).join("");
}

function populateYears() {
  const sel = $("yearSelect");
  Object.keys(YEAR_COUNTS)
    .map(Number)
    .sort((a, b) => b - a)
    .forEach(yr => {
      const opt = document.createElement("option");
      opt.value = String(yr);
      opt.textContent = `${yr} (${YEAR_COUNTS[yr]})`;
      sel.appendChild(opt);
    });
}

function renderMotifButtons() {
  $("motifFilters").innerHTML = MOTIFS.map(m => {
    const count = m.key === "ALL" ? ALBUMS.length : ALBUMS.filter(m.test).length;
    const active = state.motif === m.key;
    return `<button type="button" class="motif-btn${active ? " active" : ""}" data-motif="${m.key}">${m.label} (${count})</button>`;
  }).join("");
}

function getFilteredSorted() {
  const q = state.search.trim().toLowerCase();
  const motifObj = MOTIFS.find(m => m.key === state.motif) || MOTIFS[0];

  let list = ALBUMS.filter(a => {
    if (state.favoritesOnly && !state.favorites.has(a.idx)) return false;
    if (state.yearFilter !== "ALL" && String(a.year) !== state.yearFilter) return false;
    if (!motifObj.test(a)) return false;
    if (q) {
      const hay = `${a.idx} ${a.title} ${a.year} ${a.iso}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  if (state.sortBy === "oldest") {
    list = list.slice().sort((a, b) => (a.iso || "9999").localeCompare(b.iso || "9999") || b.idx - a.idx);
  } else if (state.sortBy === "newest") {
    list = list.slice().sort((a, b) => (b.iso || "").localeCompare(a.iso || "") || a.idx - b.idx);
  } else if (state.sortBy === "title") {
    list = list.slice().sort((a, b) => a.title.localeCompare(b.title, undefined, { sensitivity: "base" }));
  } else if (state.sortBy === "titleDesc") {
    list = list.slice().sort((a, b) => b.title.localeCompare(a.title, undefined, { sensitivity: "base" }));
  } else if (state.sortBy === "longest") {
    list = list.slice().sort((a, b) => b.title.length - a.title.length || a.idx - b.idx);
  } else if (state.sortBy === "shortest") {
    list = list.slice().sort((a, b) => a.title.length - b.title.length || a.idx - b.idx);
  }
  return list;
}

function pickRandomAlbum() {
  const pool = getFilteredSorted();
  const base = pool.length ? pool : ALBUMS;
  const choices = base.filter(a => a.idx !== state.currentIdx);
  const pick = choices.length ? choices[Math.floor(Math.random() * choices.length)] : base[0];
  selectAlbum(pick.idx);
}

function updateHeaderBadges() {
  $("favCount").textContent = String(state.favorites.size);
  $("favFilterBtn").classList.toggle("active", state.favoritesOnly);
  $("wallToggleBtn").classList.toggle("active", state.wallOpen);
}

function renderSidebar() {
  const listEl = $("albumList");
  const filtered = getFilteredSorted();
  $("visibleCount").textContent = String(filtered.length);

  const motifObj = MOTIFS.find(m => m.key === state.motif);
  if (state.favoritesOnly) $("scopeLabel").textContent = "Saved Folios";
  else if (state.yearFilter !== "ALL") $("scopeLabel").textContent = `Year ${state.yearFilter}`;
  else if (state.motif !== "ALL" && motifObj) $("scopeLabel").textContent = motifObj.label;
  else if (state.sortBy === "oldest") $("scopeLabel").textContent = "2012 → 2026";
  else if (state.sortBy === "title") $("scopeLabel").textContent = "Title A–Z";
  else if (state.sortBy === "titleDesc") $("scopeLabel").textContent = "Title Z–A";
  else if (state.sortBy === "longest") $("scopeLabel").textContent = "Longest Titles";
  else if (state.sortBy === "shortest") $("scopeLabel").textContent = "Shortest Titles";
  else $("scopeLabel").textContent = "Newest First";

  listEl.classList.toggle("mini-grid", state.sidebarMode === "grid");

  if (!filtered.length) {
    listEl.innerHTML = `<div style="padding:36px 16px;text-align:center;color:var(--umber-dim);grid-column:1/-1;">No folios match this filter.</div>`;
    return;
  }

  const slice = filtered.slice(0, state.listLimit);
  const remaining = filtered.length - slice.length;

  let html = "";
  if (state.sidebarMode === "grid") {
    html = slice.map(a => `
      <div class="grid-tile${a.idx === state.currentIdx ? " active" : ""}" data-idx="${a.idx}" title="${escapeHtml(a.title)} (${a.year})">
        <img src="${a.thumb}" alt="${escapeHtml(a.title)}" loading="lazy" referrerpolicy="no-referrer">
        <div class="grid-tile-cap">${escapeHtml(a.title)}</div>
      </div>
    `).join("");
  } else {
    html = slice.map(a => {
      const isFav = state.favorites.has(a.idx);
      const isActive = a.idx === state.currentIdx;
      return `
        <div class="row${isActive ? " active" : ""}" data-idx="${a.idx}">
          <img class="thumb" src="${a.thumb}" alt="" loading="lazy" referrerpolicy="no-referrer">
          <div class="info">
            <div class="row-title" title="${escapeHtml(a.title)}">${escapeHtml(a.title)}</div>
            <div class="row-meta">#${String(a.idx).padStart(3, "0")} · ${a.year || "Archive"} · ${formatDate(a.iso) || "Wings Of An Angel"}</div>
          </div>
          <button class="fav-star${isFav ? " saved" : ""}" type="button" data-fav="${a.idx}" aria-label="Save ${escapeHtml(a.title)}" title="Save release">${isFav ? "★" : "☆"}</button>
        </div>
      `;
    }).join("");
  }

  if (remaining > 0) {
    const nextBatch = Math.min(PAGE_SIZE, remaining);
    html += `
      <div class="load-more-wrap">
        <button type="button" class="load-more-btn" id="loadMoreListBtn">Load ${nextBatch} More (${remaining} left)</button>
        <button type="button" class="load-more-btn" id="loadAllListBtn">Show All ${filtered.length}</button>
      </div>
    `;
  }

  listEl.innerHTML = html;
}

function renderWall() {
  const filtered = getFilteredSorted();
  $("wallCount").textContent = String(filtered.length);
  const slice = filtered.slice(0, state.wallLimit);
  const remaining = filtered.length - slice.length;

  let html = slice.map(a => `
    <div class="wall-card${a.idx === state.currentIdx ? " active" : ""}" data-idx="${a.idx}" title="${escapeHtml(a.title)} (${a.year})">
      <img src="${a.thumb}" alt="${escapeHtml(a.title)}" loading="lazy" referrerpolicy="no-referrer">
      <div class="wall-cap">
        <div class="wall-cap-title">${escapeHtml(a.title)}</div>
        <div class="wall-cap-year">#${String(a.idx).padStart(3, "0")} · ${a.year || "Archive"}</div>
      </div>
    </div>
  `).join("");

  if (remaining > 0) {
    const nextBatch = Math.min(WALL_PAGE_SIZE, remaining);
    html += `
      <div class="load-more-wrap">
        <button type="button" class="load-more-btn" id="loadMoreWallBtn">Load ${nextBatch} More Panels (${remaining} left)</button>
        <button type="button" class="load-more-btn" id="loadAllWallBtn">Show All ${filtered.length}</button>
      </div>
    `;
  }

  $("wallGrid").innerHTML = html;
}

function renderDetail() {
  const a = ALBUMS.find(x => x.idx === state.currentIdx) || ALBUMS[0];
  state.currentIdx = a.idx;
  const isFav = state.favorites.has(a.idx);

  $("activeBloom").style.backgroundImage = `url('${a.cover}')`;

  const pool = getFilteredSorted();
  const navList = pool.length ? pool : ALBUMS;
  const pos = navList.findIndex(x => x.idx === a.idx);
  const prev = pos > 0 ? navList[pos - 1] : null;
  const next = pos >= 0 && pos < navList.length - 1 ? navList[pos + 1] : null;

  const iframeSrc = `https://bandcamp.com/EmbeddedPlayer/album=${a.id}/size=large/bgcol=0b0d12/linkcol=ddb563/tracklist=true/artwork=small/transparent=true/`;

  const sameYear = fisherYates(ALBUMS.filter(x => x.year === a.year && x.idx !== a.idx));
  const others = fisherYates(ALBUMS.filter(x => x.year !== a.year && x.idx !== a.idx));
  const neighbors = sameYear.concat(others).slice(0, 6);
  const yearTotal = YEAR_COUNTS[a.year] || 1;
  const isLongProse = a.title.length > 68;

  const histAlbums = state.history.map(id => ALBUMS[id - 1]).filter(Boolean);
  const historyHtml = histAlbums.length ? `
    <div class="history-strip">
      <div class="history-head">
        <span>Recently Played · ${histAlbums.length}</span>
        <button class="history-clear" id="clearHistBtn" type="button">Clear</button>
      </div>
      <div class="history-items" id="historyItems">
        ${histAlbums.map(h => `
          <div class="history-chip${h.idx === a.idx ? " active" : ""}" data-idx="${h.idx}" title="${escapeHtml(h.title)} (${h.year})">
            <img src="${h.thumb}" alt="" loading="lazy" referrerpolicy="no-referrer">
            <div class="history-chip-text">
              <div class="history-chip-title">${escapeHtml(h.title)}</div>
              <div class="history-chip-year">#${String(h.idx).padStart(3, "0")} · ${h.year || "Archive"}</div>
            </div>
          </div>
        `).join("")}
      </div>
    </div>
  ` : "";

  $("detail").innerHTML = `
    <div class="detail-stage">
      ${historyHtml}

      <section class="hero-card" aria-label="Selected release">
        <div class="hero-art-wrap">
          <img class="hero-art" src="${a.cover}" alt="${escapeHtml(a.title)} cover art" referrerpolicy="no-referrer">
        </div>
        <div class="hero-content">
          <div class="hero-meta-line">
            <span class="folio-num">Folio ${String(a.idx).padStart(3, "0")} / 923</span>
            <span class="sep" aria-hidden="true">·</span>
            <span>${formatDate(a.iso) || a.year || "Archive"}</span>
            <span class="sep" aria-hidden="true">·</span>
            <span>Wings Of An Angel</span>
            <span class="sep" aria-hidden="true">·</span>
            <span>Israel</span>
          </div>
          <h1 class="hero-title${isLongProse ? " long-prose" : ""}">${escapeHtml(a.title)}</h1>
          <div class="hero-sub">
            One of <strong>${yearTotal} ${yearTotal === 1 ? "release" : "releases"}</strong> archived from ${a.year} across 15 years of Wings Of An Angel
          </div>
          <div class="hero-actions">
            <button class="altar-btn primary" id="deckRandomBtn" type="button">Random Release</button>
            <button class="altar-btn${isFav ? " active" : ""}" id="detailFavBtn" type="button">${isFav ? "★ Saved" : "☆ Save Release"}</button>
            <a class="altar-btn" href="${escapeHtml(a.url)}" target="_blank" rel="noopener">Open on Bandcamp ↗</a>
          </div>
        </div>
      </section>

      <div class="deck-grid">
        <div class="iframe-shell">
          <iframe src="${iframeSrc}" title="Wings Of An Angel — ${escapeHtml(a.title)}" seamless allow="autoplay"></iframe>
        </div>

        <div class="companion-card">
          <div class="card-kicker">${sameYear.length ? `Companion Panels from ${a.year}` : "Companion Panels from the Archive"}</div>
          <div class="mini-collage" id="miniCollage">
            ${neighbors.map(c => `
              <div class="mini-collage-item" data-idx="${c.idx}" title="${escapeHtml(c.title)} (${c.year})">
                <img src="${c.thumb}" alt="${escapeHtml(c.title)}" loading="lazy" referrerpolicy="no-referrer">
                <span>${escapeHtml(c.title)}</span>
              </div>
            `).join("")}
          </div>
          <blockquote class="artist-epigraph">
            “Sonic architectures built from the rubble of everything beautiful; reluctant soundscapes sculpted from the silence between disasters.”
          </blockquote>
          <div class="field-note">
            All <strong>923 releases</strong> from <strong>wingsofanangel.bandcamp.com</strong> (2012–2026) are indexed with official Bandcamp embeds. Filter by year, search surrealist title fragments, sort by prose-title length, or open the Cover Wall to wander the gallery.
          </div>
          ${a.year ? `
            <div class="era-action-row">
              <button type="button" class="altar-btn" id="filterYearBtn">Filter to ${a.year} (${yearTotal})</button>
              <button type="button" class="altar-btn" id="openWallInlineBtn">Browse Cover Wall</button>
            </div>
          ` : ""}
        </div>
      </div>

      <div class="detail-nav">
        <button class="nav-btn prev" id="prevBtn" type="button" ${!prev ? "disabled" : ""}>
          <small>← Previous Folio</small>
          <span>${prev ? `#${String(prev.idx).padStart(3, "0")} · ${escapeHtml(prev.title)}` : "—"}</span>
        </button>
        <button class="nav-btn next" id="nextBtn" type="button" ${!next ? "disabled" : ""}>
          <small>Next Folio →</small>
          <span>${next ? `#${String(next.idx).padStart(3, "0")} · ${escapeHtml(next.title)}` : "—"}</span>
        </button>
      </div>

      <div class="kbd-bar">
        <span>↑ / K Prev</span>
        <span>↓ / J Next</span>
        <span>R Random</span>
        <span>W Cover Wall</span>
        <span>F Save</span>
      </div>
    </div>
  `;

  $("deckRandomBtn").addEventListener("click", pickRandomAlbum);
  $("detailFavBtn").addEventListener("click", () => toggleFavorite(a.idx));
  $("miniCollage").addEventListener("click", (e) => {
    const card = e.target.closest(".mini-collage-item");
    if (card) selectAlbum(Number(card.dataset.idx));
  });
  if (prev) $("prevBtn").addEventListener("click", () => selectAlbum(prev.idx));
  if (next) $("nextBtn").addEventListener("click", () => selectAlbum(next.idx));

  const filterYearBtn = $("filterYearBtn");
  if (filterYearBtn) {
    filterYearBtn.addEventListener("click", () => {
      state.yearFilter = String(a.year);
      state.listLimit = PAGE_SIZE;
      $("yearSelect").value = state.yearFilter;
      renderSidebar();
      showToast(`Filtered archive to ${a.year} (${yearTotal} releases)`);
    });
  }
  const openWallInlineBtn = $("openWallInlineBtn");
  if (openWallInlineBtn) {
    openWallInlineBtn.addEventListener("click", () => toggleWall(true));
  }

  const histEl = $("historyItems");
  if (histEl) {
    histEl.addEventListener("click", (e) => {
      const chip = e.target.closest(".history-chip");
      if (chip) selectAlbum(Number(chip.dataset.idx));
    });
  }
  const clearHistBtn = $("clearHistBtn");
  if (clearHistBtn) {
    clearHistBtn.addEventListener("click", () => {
      state.history = [state.currentIdx];
      saveStorage();
      renderDetail();
      showToast("Cleared Recently Played history");
    });
  }

  $("detail").scrollTop = 0;
  const activeRow = document.querySelector(".row.active, .grid-tile.active");
  if (activeRow) activeRow.scrollIntoView({ block: "nearest", behavior: "smooth" });
}

function selectAlbum(idx) {
  state.currentIdx = Number(idx);
  recordHistory(state.currentIdx);
  if (state.wallOpen) {
    state.wallOpen = false;
    $("wallView").classList.remove("open");
    $("splitApp").classList.remove("hidden");
  }
  updateHeaderBadges();
  renderSidebar();
  renderDetail();
}

function toggleFavorite(idx) {
  const n = Number(idx);
  const rel = ALBUMS.find(x => x.idx === n);
  const name = rel ? (rel.title.length > 42 ? rel.title.slice(0, 42) + "…" : rel.title) : `#${n}`;
  if (state.favorites.has(n)) {
    state.favorites.delete(n);
    showToast(`Removed “${name}” from Saved`);
  } else {
    state.favorites.add(n);
    showToast(`Saved “${name}”`);
  }
  saveStorage();
  updateHeaderBadges();
  renderSidebar();
  const favBtn = $("detailFavBtn");
  if (favBtn && state.currentIdx === n) {
    const isFav = state.favorites.has(n);
    favBtn.classList.toggle("active", isFav);
    favBtn.textContent = isFav ? "★ Saved" : "☆ Save Release";
  }
}

function toggleWall(force) {
  state.wallOpen = typeof force === "boolean" ? force : !state.wallOpen;
  $("wallView").classList.toggle("open", state.wallOpen);
  $("splitApp").classList.toggle("hidden", state.wallOpen);
  updateHeaderBadges();
  if (state.wallOpen) {
    state.wallLimit = WALL_PAGE_SIZE;
    renderWall();
  }
}

// Listeners
$("randomBtn").addEventListener("click", pickRandomAlbum);
$("favFilterBtn").addEventListener("click", () => {
  state.favoritesOnly = !state.favoritesOnly;
  state.listLimit = PAGE_SIZE;
  updateHeaderBadges();
  renderSidebar();
  if (state.wallOpen) renderWall();
});
$("wallToggleBtn").addEventListener("click", () => toggleWall());
$("closeWallBtn").addEventListener("click", () => toggleWall(false));
$("remixCollageBtn").addEventListener("click", () => {
  buildBackdropCollage();
  showToast("Shuffled 48-panel triptych backdrop");
});

$("searchInput").addEventListener("input", (e) => {
  state.search = e.target.value;
  state.listLimit = PAGE_SIZE;
  state.wallLimit = WALL_PAGE_SIZE;
  renderSidebar();
  if (state.wallOpen) renderWall();
});

$("sortSelect").addEventListener("change", (e) => {
  state.sortBy = e.target.value;
  state.listLimit = PAGE_SIZE;
  renderSidebar();
  if (state.wallOpen) renderWall();
});

$("yearSelect").addEventListener("change", (e) => {
  state.yearFilter = e.target.value;
  state.listLimit = PAGE_SIZE;
  state.wallLimit = WALL_PAGE_SIZE;
  renderSidebar();
  if (state.wallOpen) renderWall();
});

$("motifFilters").addEventListener("click", (e) => {
  const btn = e.target.closest(".motif-btn");
  if (!btn) return;
  state.motif = btn.dataset.motif;
  state.listLimit = PAGE_SIZE;
  state.wallLimit = WALL_PAGE_SIZE;
  renderMotifButtons();
  renderSidebar();
  if (state.wallOpen) renderWall();
});

$("viewListBtn").addEventListener("click", () => {
  state.sidebarMode = "list";
  $("viewListBtn").classList.add("active");
  $("viewGridBtn").classList.remove("active");
  renderSidebar();
});
$("viewGridBtn").addEventListener("click", () => {
  state.sidebarMode = "grid";
  $("viewGridBtn").classList.add("active");
  $("viewListBtn").classList.remove("active");
  renderSidebar();
});

$("albumList").addEventListener("click", (e) => {
  if (e.target.id === "loadMoreListBtn") {
    state.listLimit += PAGE_SIZE;
    renderSidebar();
    return;
  }
  if (e.target.id === "loadAllListBtn") {
    state.listLimit = ALBUMS.length;
    renderSidebar();
    return;
  }
  const star = e.target.closest(".fav-star");
  if (star) {
    e.stopPropagation();
    toggleFavorite(star.dataset.fav);
    return;
  }
  const item = e.target.closest(".row, .grid-tile");
  if (item) selectAlbum(Number(item.dataset.idx));
});

$("wallGrid").addEventListener("click", (e) => {
  if (e.target.id === "loadMoreWallBtn") {
    state.wallLimit += WALL_PAGE_SIZE;
    renderWall();
    return;
  }
  if (e.target.id === "loadAllWallBtn") {
    state.wallLimit = ALBUMS.length;
    renderWall();
    return;
  }
  const card = e.target.closest(".wall-card");
  if (card) selectAlbum(Number(card.dataset.idx));
});

document.addEventListener("keydown", (e) => {
  const tag = (e.target && e.target.tagName) ? e.target.tagName.toLowerCase() : "";
  if (tag === "input" || tag === "select" || tag === "textarea") {
    if (e.key === "Escape") e.target.blur();
    return;
  }
  if (e.key === "Escape" && state.wallOpen) {
    toggleWall(false);
    return;
  }
  const pool = getFilteredSorted();
  const list = pool.length ? pool : ALBUMS;
  const pos = list.findIndex(x => x.idx === state.currentIdx);

  if (e.key === "ArrowDown" || e.key === "j") {
    e.preventDefault();
    if (pos >= 0 && pos < list.length - 1) selectAlbum(list[pos + 1].idx);
  } else if (e.key === "ArrowUp" || e.key === "k") {
    e.preventDefault();
    if (pos > 0) selectAlbum(list[pos - 1].idx);
  } else if (e.key === "r" || e.key === "R") {
    pickRandomAlbum();
  } else if (e.key === "w" || e.key === "W") {
    toggleWall();
  } else if (e.key === "f" || e.key === "F") {
    toggleFavorite(state.currentIdx);
  }
});

// Init
loadStorage();
if (!state.history.length) recordHistory(1);
populateYears();
renderMotifButtons();
buildBackdropCollage();
updateHeaderBadges();
renderSidebar();
renderDetail();
</script>
<script src="./mobile-adapt.js" defer></script>
<script src="./now-playing-dock.js" defer></script>
<script src="./chrome-cast.js" defer></script>
</body>
</html>
