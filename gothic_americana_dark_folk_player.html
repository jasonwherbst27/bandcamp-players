<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOTHIC AMERICANA &amp; DARK FOLK · 73 Bandcamp Releases</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,400;1,600&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --walnut: #0b0908;
  --parlor: rgba(18, 14, 12, 0.85);
  --parlor-strong: rgba(14, 11, 9, 0.93);
  --timber: #332922;
  --timber-soft: #261f1a;
  --brass: #b08d57;
  --gold: #d4af6a;
  --oxblood: #7a1f24;
  --oxblood-hi: #a12b32;
  --sage: #6b8270;
  --parchment: #ece2cc;
  --parchment-soft: #c2b49a;
  --parchment-dim: #8a7d68;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: var(--walnut);
  color: var(--parchment);
  font-family: 'Crimson Pro', serif;
  font-size: 16px;
  min-height: 100vh;
  overflow-x: hidden;
}

/* FULL-BLEED DAGUERREOTYPE COVER-ART COLLAGE BACKDROP */
.collage-bg {
  position: fixed;
  inset: -40px;
  z-index: 0;
  overflow: hidden;
  pointer-events: none;
}
.collage-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 5px;
  width: calc(100% + 80px);
  height: calc(100% + 80px);
  filter: blur(5px) sepia(0.45) contrast(1.12) brightness(0.32);
  animation: slowDrift 46s ease-in-out infinite alternate;
  transform-origin: center;
}
@media (max-width: 900px) {
  .collage-grid { grid-template-columns: repeat(5, 1fr); }
}
.collage-tile {
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: cover;
  opacity: 0.9;
}

/* Active album candlelight bloom */
.active-bloom {
  position: fixed;
  inset: -60px;
  z-index: 1;
  pointer-events: none;
  background-size: cover;
  background-position: center;
  filter: blur(70px) sepia(0.35) saturate(1.25) brightness(0.30);
  opacity: 0.55;
  transition: background-image 0.9s ease;
}

/* Aged parchment grain + candlelight vignette */
.parlor-veil {
  position: fixed;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  background:
    radial-gradient(ellipse 70% 55% at 22% 16%, rgba(176, 141, 87, 0.14), transparent 65%),
    radial-gradient(ellipse 65% 55% at 82% 84%, rgba(122, 31, 36, 0.16), transparent 65%),
    radial-gradient(ellipse at center, rgba(11, 9, 8, 0.42) 22%, rgba(6, 5, 4, 0.90) 100%);
}
.parlor-veil::after {
  content: '';
  position: absolute;
  inset: 0;
  opacity: 0.11;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='1.1' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  mix-blend-mode: overlay;
}

@keyframes slowDrift {
  0% { transform: translate3d(-10px, -8px, 0) scale(1.04); }
  100% { transform: translate3d(14px, 10px, 0) scale(1.09); }
}
@keyframes fadeRise {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* HEADER */
.header {
  position: relative;
  z-index: 20;
  padding: 16px 28px;
  background: var(--parlor-strong);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border-bottom: 1px solid var(--timber);
  box-shadow: 0 4px 26px rgba(0, 0, 0, 0.7);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
}
.header::after {
  content: '';
  position: absolute;
  bottom: -1px;
  left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--brass), var(--oxblood-hi), var(--brass), transparent);
  opacity: 0.75;
}

.brand-wrap {
  display: flex;
  align-items: center;
  gap: 14px;
}
.woodcut-mark {
  width: 38px;
  height: 38px;
  border: 1px solid var(--brass);
  outline: 1px solid rgba(176, 141, 87, 0.25);
  outline-offset: 3px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'IM Fell English', serif;
  font-size: 20px;
  color: var(--gold);
  background: rgba(122, 31, 36, 0.22);
  flex-shrink: 0;
}
.brand {
  font-family: 'IM Fell English', serif;
  font-size: clamp(24px, 3vw, 36px);
  line-height: 1;
  letter-spacing: 1px;
  color: var(--parchment);
  text-shadow: 0 2px 14px rgba(176, 141, 87, 0.24);
}
.subbrand {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  letter-spacing: 2.2px;
  text-transform: uppercase;
  color: var(--parchment-dim);
  margin-top: 5px;
}

.header-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}

.parlor-btn {
  background: rgba(26, 20, 17, 0.88);
  color: var(--parchment);
  border: 1px solid var(--timber);
  border-radius: 3px;
  padding: 8px 13px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  cursor: pointer;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all 0.16s var(--ease);
}
.parlor-btn:hover {
  border-color: var(--gold);
  background: rgba(176, 141, 87, 0.16);
  color: #fff;
  transform: translateY(-1px);
}
.parlor-btn.primary, .parlor-btn.active {
  background: var(--oxblood);
  border-color: var(--gold);
  color: var(--parchment);
}
.parlor-btn.primary:hover {
  background: var(--oxblood-hi);
}
.parlor-btn .badge {
  background: #0b0908;
  color: var(--gold);
  padding: 1px 6px;
  border-radius: 2px;
  font-size: 10px;
}

/* MAIN SPLIT LAYOUT */
.app {
  position: relative;
  z-index: 10;
  display: grid;
  grid-template-columns: 405px 1fr;
  min-height: calc(100vh - 80px);
}
@media (max-width: 960px) {
  .header { padding: 14px 16px; }
  .app { grid-template-columns: 1fr; }
}

/* SIDEBAR */
.sidebar {
  background: var(--parlor);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-right: 1px solid var(--timber);
  display: flex;
  flex-direction: column;
  max-height: calc(100vh - 80px);
  overflow: hidden;
}
@media (max-width: 960px) {
  .sidebar { max-height: 48vh; border-right: none; border-bottom: 1px solid var(--timber); }
}

.sidebar-controls {
  padding: 13px 15px 11px;
  border-bottom: 1px solid var(--timber);
  background: rgba(14, 11, 9, 0.85);
  display: flex;
  flex-direction: column;
  gap: 9px;
}

.scope-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  letter-spacing: 1.8px;
  text-transform: uppercase;
  color: var(--parchment-dim);
}
.scope-row .count { color: var(--gold); font-weight: 600; }

.search-input, .select-input {
  background: #0c0908;
  border: 1px solid var(--timber);
  border-radius: 3px;
  color: var(--parchment);
  padding: 8px 10px;
  font-family: 'Crimson Pro', serif;
  font-size: 14.5px;
  outline: none;
  width: 100%;
}
.search-input::placeholder { color: var(--parchment-dim); font-style: italic; }
.search-input:focus, .select-input:focus { border-color: var(--gold); }

.controls-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}

.sidebar-tools {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}
.mini-toggle {
  background: transparent;
  border: 1px solid var(--timber);
  border-radius: 2px;
  color: var(--parchment-soft);
  padding: 4px 9px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9.5px;
  letter-spacing: 1px;
  text-transform: uppercase;
  cursor: pointer;
}
.mini-toggle:hover, .mini-toggle.active {
  border-color: var(--gold);
  background: rgba(176, 141, 87, 0.16);
  color: var(--gold);
}

.album-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px 10px 24px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.album-list.mini-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 7px;
  align-content: start;
}

.row {
  padding: 8px 10px;
  border-radius: 3px;
  border: 1px solid transparent;
  border-left: 2px solid transparent;
  background: rgba(24, 19, 16, 0.56);
  cursor: pointer;
  display: grid;
  grid-template-columns: 46px 1fr 22px;
  gap: 10px;
  align-items: center;
  transition: all 0.15s var(--ease);
}
.row:hover {
  background: rgba(36, 28, 23, 0.85);
  border-color: var(--timber);
  border-left-color: var(--brass);
}
.row.active {
  background: rgba(122, 31, 36, 0.28);
  border-color: var(--brass);
  border-left: 3px solid var(--gold);
}

.thumb {
  width: 46px;
  height: 46px;
  border-radius: 2px;
  object-fit: cover;
  background: #0b0908;
  border: 1px solid var(--timber);
}
.row .info { min-width: 0; }
.row-title {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 700;
  font-size: 16px;
  color: var(--parchment);
  line-height: 1.15;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.row-artist {
  font-family: 'Crimson Pro', serif;
  font-style: italic;
  font-size: 13.5px;
  color: var(--gold);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.row-meta {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9px;
  letter-spacing: 0.8px;
  color: var(--parchment-dim);
  text-transform: uppercase;
  margin-top: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.fav-star {
  background: transparent;
  border: none;
  color: var(--parchment-dim);
  font-size: 15px;
  cursor: pointer;
  line-height: 1;
}
.fav-star:hover { color: var(--gold); }
.fav-star.saved { color: var(--oxblood-hi); }

.grid-tile {
  position: relative;
  aspect-ratio: 1 / 1;
  border-radius: 2px;
  overflow: hidden;
  cursor: pointer;
  border: 1px solid var(--timber);
  background: #0b0908;
  transition: transform 0.18s var(--ease), border-color 0.18s;
}
.grid-tile:hover { transform: scale(1.04); border-color: var(--gold); z-index: 2; }
.grid-tile.active { border-color: var(--gold); box-shadow: 0 0 14px rgba(212, 175, 106, 0.45); }
.grid-tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
.grid-tile-cap {
  position: absolute;
  inset: auto 0 0 0;
  padding: 16px 6px 5px;
  background: linear-gradient(180deg, transparent, rgba(8,6,5,0.95));
  font-size: 10.5px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--parchment);
}

/* DETAIL SPLIT DECK */
.detail {
  padding: 24px 34px 60px;
  overflow-y: auto;
  max-height: calc(100vh - 80px);
}
@media (max-width: 960px) {
  .detail { max-height: none; padding: 18px 16px 48px; }
}

.detail-stage {
  max-width: 980px;
  margin: 0 auto;
  animation: fadeRise 0.3s var(--ease);
}

/* RECENTLY PLAYED STRIP */
.history-strip {
  background: var(--parlor-strong);
  backdrop-filter: blur(16px);
  border: 1px solid var(--timber);
  border-radius: 3px;
  padding: 10px 14px;
  margin-bottom: 18px;
}
.history-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9.5px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--gold);
}
.history-clear {
  background: transparent;
  border: none;
  color: var(--parchment-dim);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9px;
  letter-spacing: 1px;
  text-transform: uppercase;
  cursor: pointer;
  text-decoration: underline;
}
.history-clear:hover { color: var(--oxblood-hi); }
.history-items {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 4px;
}
.history-chip {
  display: flex;
  align-items: center;
  gap: 8px;
  background: rgba(26, 20, 17, 0.9);
  border: 1px solid var(--timber);
  border-radius: 3px;
  padding: 4px 10px 4px 4px;
  cursor: pointer;
  flex-shrink: 0;
  max-width: 215px;
  transition: border-color 0.15s, background 0.15s;
}
.history-chip:hover { border-color: var(--gold); background: rgba(122, 31, 36, 0.22); }
.history-chip.active { border-color: var(--gold); }
.history-chip img {
  width: 30px;
  height: 30px;
  border-radius: 2px;
  object-fit: cover;
  flex-shrink: 0;
}
.history-chip-text { min-width: 0; }
.history-chip-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--parchment);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.history-chip-artist {
  font-style: italic;
  font-size: 11.5px;
  color: var(--parchment-soft);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* HERO HYMNAL RECORD CARD */
.hero-card {
  background: var(--parlor);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--brass);
  outline: 1px solid rgba(176, 141, 87, 0.2);
  outline-offset: -5px;
  border-radius: 3px;
  padding: 22px 26px;
  margin-bottom: 20px;
  display: grid;
  grid-template-columns: 152px 1fr;
  gap: 24px;
  align-items: center;
  box-shadow: 0 14px 40px rgba(0, 0, 0, 0.65);
}
@media (max-width: 680px) {
  .hero-card { grid-template-columns: 1fr; text-align: center; justify-items: center; }
}
.hero-art {
  width: 152px;
  height: 152px;
  border-radius: 2px;
  object-fit: cover;
  border: 1px solid var(--brass);
  box-shadow: 0 10px 28px rgba(0, 0, 0, 0.75);
}
.hero-badges {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-bottom: 8px;
}
@media (max-width: 680px) {
  .hero-badges { justify-content: center; }
}
.stamp {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9.5px;
  letter-spacing: 1.4px;
  text-transform: uppercase;
  padding: 3px 9px;
  border: 1px solid var(--timber);
  background: #0c0908;
  color: var(--parchment-soft);
}
.stamp.gold { border-color: var(--brass); color: var(--gold); }
.stamp.sage { border-color: var(--sage); color: #9db8a3; }

.hero-title {
  font-family: 'IM Fell English', serif;
  font-size: clamp(26px, 3.4vw, 40px);
  line-height: 1.04;
  color: var(--parchment);
}
.hero-artist {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 24px;
  color: var(--gold);
  margin-top: 4px;
}
.hero-featured {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  color: var(--parchment-soft);
  margin-top: 8px;
}
.hero-featured b { color: var(--parchment); }
.hero-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 14px;
}
@media (max-width: 680px) {
  .hero-actions { justify-content: center; }
}

/* BANDCAMP DECK */
.deck-grid {
  display: grid;
  grid-template-columns: minmax(310px, 420px) 1fr;
  gap: 22px;
  align-items: start;
}
@media (max-width: 820px) {
  .deck-grid { grid-template-columns: 1fr; }
}

.iframe-shell {
  background: var(--parlor-strong);
  border: 1px solid var(--brass);
  border-radius: 3px;
  padding: 10px;
  box-shadow: 0 14px 36px rgba(0, 0, 0, 0.7);
}
.iframe-shell iframe {
  display: block;
  width: 100%;
  height: 470px;
  border: 0;
  background: #120e0c;
}

.companion-card {
  background: var(--parlor);
  backdrop-filter: blur(18px);
  border: 1px solid var(--timber);
  border-radius: 3px;
  padding: 18px 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.card-kicker {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--gold);
  border-bottom: 1px solid var(--timber);
  padding-bottom: 8px;
}
.mini-collage {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.mini-collage-item {
  position: relative;
  aspect-ratio: 1 / 1;
  border-radius: 2px;
  overflow: hidden;
  cursor: pointer;
  border: 1px solid var(--timber);
  transition: transform 0.18s var(--ease), border-color 0.18s;
}
.mini-collage-item:hover { transform: translateY(-2px) scale(1.03); border-color: var(--gold); }
.mini-collage-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
.mini-collage-item span {
  position: absolute;
  inset: auto 0 0 0;
  padding: 14px 6px 5px;
  background: linear-gradient(180deg, transparent, rgba(8,6,5,0.95));
  font-size: 10.5px;
  color: var(--parchment);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* NAV BAR */
.detail-nav {
  display: flex;
  gap: 12px;
  margin-top: 20px;
}
.nav-btn {
  flex: 1;
  background: var(--parlor);
  border: 1px solid var(--timber);
  border-radius: 3px;
  color: var(--parchment);
  padding: 12px 16px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  cursor: pointer;
  text-align: left;
  transition: all 0.16s var(--ease);
}
.nav-btn:hover:not(:disabled) {
  border-color: var(--gold);
  background: rgba(122, 31, 36, 0.24);
  transform: translateY(-1px);
}
.nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.nav-btn.next { text-align: right; }
.nav-btn small {
  display: block;
  font-size: 9px;
  color: var(--gold);
  margin-bottom: 4px;
}
.nav-btn span {
  font-family: 'Cormorant Garamond', serif;
  font-size: 16px;
  font-weight: 700;
  text-transform: none;
  letter-spacing: 0;
}

.kbd-bar {
  margin-top: 14px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9.5px;
  letter-spacing: 1.3px;
  color: var(--parchment-dim);
  text-transform: uppercase;
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
}

/* FULL COVER WALL VIEW */
.wall-view {
  position: relative;
  z-index: 12;
  display: none;
  padding: 20px 24px 60px;
  max-width: 1500px;
  margin: 0 auto;
}
.wall-view.open { display: block; }
.app.hidden { display: none; }

.wall-header {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
  padding: 12px 18px;
  background: var(--parlor-strong);
  border: 1px solid var(--brass);
  border-radius: 3px;
}
.wall-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 10px;
}
.wall-card {
  position: relative;
  aspect-ratio: 1 / 1;
  border-radius: 2px;
  overflow: hidden;
  cursor: pointer;
  border: 1px solid var(--timber);
  background: #0b0908;
  transition: transform 0.2s var(--ease), border-color 0.2s, box-shadow 0.2s;
}
.wall-card:hover {
  transform: translateY(-3px) scale(1.03);
  border-color: var(--gold);
  box-shadow: 0 10px 24px rgba(0,0,0,0.75);
  z-index: 3;
}
.wall-card.active {
  border-color: var(--oxblood-hi);
  box-shadow: 0 0 18px rgba(161, 43, 50, 0.65);
}
.wall-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
.wall-cap {
  position: absolute;
  inset: auto 0 0 0;
  padding: 22px 8px 7px;

function loadStorage() {
  try {
    const rawFavs = localStorage.getItem(STORAGE_FAVS);
    if (rawFavs) JSON.parse(rawFavs).forEach(n => state.favorites.add(Number(n)));
    const rawHist = localStorage.getItem(STORAGE_HIST);
    if (rawHist) {
      const parsed = JSON.parse(rawHist);
      if (Array.isArray(parsed)) state.history = parsed.map(Number).filter(n => n >= 1 && n <= ALBUMS.length).slice(0, 14);
    }
  } catch (_) {}
}

function saveStorage() {
  try {
    localStorage.setItem(STORAGE_FAVS, JSON.stringify([...state.favorites]));
    localStorage.setItem(STORAGE_HIST, JSON.stringify(state.history));
  } catch (_) {}
}

function recordHistory(idx) {
  const n = Number(idx);
  state.history = [n, ...state.history.filter(x => x !== n)].slice(0, 14);
  saveStorage();
}

function escapeHtml(s) {
  if (s == null) return "";
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

let toastTimer = null;
function showToast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2500);
}

function fisherYates(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildBackdropCollage() {
  const sample = fisherYates(ALBUMS).slice(0, 48);
  $("collageGrid").innerHTML = sample.map(a => `<img class="collage-tile" src="${a.thumb}" alt="" loading="lazy">`).join("");
}

function populateBands() {
  const sel = $("bandSelect");
  TOP_BANDS.forEach(([name, count]) => {
    const opt = document.createElement("option");
    opt.value = name;
    opt.textContent = `${name} (${count})`;
    sel.appendChild(opt);
  });
}

function getFilteredSorted() {
  const q = state.search.trim().toLowerCase();
  let list = ALBUMS.filter(a => {
    if (state.favoritesOnly && !state.favorites.has(a.idx)) return false;
    if (state.bandFilter !== "ALL" && a.bandName !== state.bandFilter) return false;
    if (q) {
      const hay = `${a.idx} ${a.artist} ${a.title} ${a.featured} ${a.location} ${a.year}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  if (state.sortBy === "newest") {
    list = list.slice().sort((a, b) => (Number(b.year) || 0) - (Number(a.year) || 0) || a.idx - b.idx);
  } else if (state.sortBy === "artist") {
    list = list.slice().sort((a, b) => a.artist.localeCompare(b.artist, undefined, { sensitivity: "base" }) || a.title.localeCompare(b.title));
  } else if (state.sortBy === "album") {
    list = list.slice().sort((a, b) => a.title.localeCompare(b.title, undefined, { sensitivity: "base" }) || a.artist.localeCompare(b.artist));
  }
  return list;
}

function pickRandomAlbum() {
  const pool = getFilteredSorted();
  const base = pool.length ? pool : ALBUMS;
  const choices = base.filter(a => a.idx !== state.currentIdx);
  const pick = choices.length ? choices[Math.floor(Math.random() * choices.length)] : base[0];
  selectAlbum(pick.idx);
}

function updateHeaderBadges() {
  $("favCount").textContent = String(state.favorites.size);
  $("favFilterBtn").classList.toggle("active", state.favoritesOnly);
  $("wallToggleBtn").classList.toggle("active", state.wallOpen);
}

function renderSidebar() {
  const listEl = $("albumList");
  const filtered = getFilteredSorted();
  $("visibleCount").textContent = String(filtered.length);

  if (state.favoritesOnly) $("scopeLabel").textContent = "Saved Favorites";
  else if (state.bandFilter !== "ALL") $("scopeLabel").textContent = state.bandFilter;
  else if (state.sortBy === "newest") $("scopeLabel").textContent = "Newest Year";
  else if (state.sortBy === "artist") $("scopeLabel").textContent = "Artist A–Z";
  else if (state.sortBy === "album") $("scopeLabel").textContent = "Album A–Z";
  else $("scopeLabel").textContent = "Discover Top";

  listEl.classList.toggle("mini-grid", state.sidebarMode === "grid");

  if (!filtered.length) {
    listEl.innerHTML = `<div style="padding:36px 16px;text-align:center;color:var(--parchment-dim);font-style:italic;grid-column:1/-1;">No releases match this filter.</div>`;
    return;
  }

  if (state.sidebarMode === "grid") {
    listEl.innerHTML = filtered.map(a => `
      <div class="grid-tile${a.idx === state.currentIdx ? " active" : ""}" data-idx="${a.idx}" title="${escapeHtml(a.title)} — ${escapeHtml(a.artist)}">
        <img src="${a.thumb}" alt="${escapeHtml(a.title)}" loading="lazy">
        <div class="grid-tile-cap">${escapeHtml(a.title)}</div>
      </div>
    `).join("");
    return;
  }

  listEl.innerHTML = filtered.map(a => {
    const isFav = state.favorites.has(a.idx);
    const isActive = a.idx === state.currentIdx;
    const subParts = [`#${String(a.idx).padStart(2, "0")}`];
    if (a.year) subParts.push(a.year);
    if (a.location) subParts.push(a.location);
    return `
      <div class="row${isActive ? " active" : ""}" data-idx="${a.idx}">
        <img class="thumb" src="${a.thumb}" alt="" loading="lazy">
        <div class="info">
          <div class="row-title">${escapeHtml(a.title)}</div>
          <div class="row-artist">${escapeHtml(a.artist)}</div>
          <div class="row-meta">${escapeHtml(subParts.join(" · "))}</div>
        </div>
        <button class="fav-star${isFav ? " saved" : ""}" data-fav="${a.idx}" title="Save release">${isFav ? "★" : "☆"}</button>
      </div>
    `;
  }).join("");
}

function renderWall() {
  const filtered = getFilteredSorted();
  $("wallCount").textContent = String(filtered.length);
  $("wallGrid").innerHTML = filtered.map(a => `
    <div class="wall-card${a.idx === state.currentIdx ? " active" : ""}" data-idx="${a.idx}">
      <img src="${a.thumb}" alt="${escapeHtml(a.title)}" loading="lazy">
      <div class="wall-cap">
        <div class="wall-cap-title">${escapeHtml(a.title)}</div>
        <div class="wall-cap-artist">${escapeHtml(a.artist)}</div>
      </div>
    </div>
  `).join("");
}

function renderDetail() {
  const a = ALBUMS.find(x => x.idx === state.currentIdx) || ALBUMS[0];
  state.currentIdx = a.idx;
  const isFav = state.favorites.has(a.idx);

  $("activeBloom").style.backgroundImage = `url('${a.cover}')`;

  const pool = getFilteredSorted();
  const navList = pool.length ? pool : ALBUMS;
  const pos = navList.findIndex(x => x.idx === a.idx);
  const prev = pos > 0 ? navList[pos - 1] : null;
  const next = pos >= 0 && pos < navList.length - 1 ? navList[pos + 1] : null;

  const iframeSrc = `https://bandcamp.com/EmbeddedPlayer/album=${a.id}/size=large/bgcol=120e0c/linkcol=d4af6a/tracklist=true/artwork=small/transparent=true/`;

  const sameBand = ALBUMS.filter(x => x.bandName === a.bandName && x.idx !== a.idx);
  const others = fisherYates(ALBUMS.filter(x => x.idx !== a.idx && x.bandName !== a.bandName));
  const collageItems = sameBand.concat(others).slice(0, 6);
  const collageLabel = sameBand.length ? `More from ${a.bandName} &amp; Parlour Neighbors` : "Gothic Americana &amp; Dark Folk Neighbors";

  const histAlbums = state.history.map(id => ALBUMS[id - 1]).filter(Boolean);
  const historyHtml = histAlbums.length ? `
    <div class="history-strip">
      <div class="history-head">
        <span>↺ Recently Played (${histAlbums.length})</span>
        <button class="history-clear" id="clearHistBtn">Clear</button>
      </div>
      <div class="history-items" id="historyItems">
        ${histAlbums.map(h => `
          <div class="history-chip${h.idx === a.idx ? " active" : ""}" data-idx="${h.idx}" title="${escapeHtml(h.title)} — ${escapeHtml(h.artist)}">
            <img src="${h.thumb}" alt="" loading="lazy">
            <div class="history-chip-text">
              <div class="history-chip-title">${escapeHtml(h.title)}</div>
              <div class="history-chip-artist">${escapeHtml(h.artist)}</div>
            </div>
          </div>
        `).join("")}
      </div>
    </div>
  ` : "";

  $("detail").innerHTML = `
    <div class="detail-stage">
      ${historyHtml}

      <div class="hero-card">
        <img class="hero-art" src="${a.cover}" alt="${escapeHtml(a.title)}">
        <div>
          <div class="hero-badges">
            <span class="stamp gold">№ ${String(a.idx).padStart(2, "0")} / 73</span>
            ${a.year ? `<span class="stamp">${escapeHtml(a.year)}</span>` : ""}
            ${a.tracks ? `<span class="stamp">${a.tracks} TRACKS</span>` : ""}
            ${a.location ? `<span class="stamp sage">${escapeHtml(a.location)}</span>` : ""}
          </div>
          <div class="hero-title">${escapeHtml(a.title)}</div>
          <div class="hero-artist">${escapeHtml(a.artist)}</div>
          ${a.featured ? `<div class="hero-featured">Featured Track: <b>${escapeHtml(a.featured)}</b></div>` : ""}
          <div class="hero-actions">
            <button class="parlor-btn primary" id="deckRandomBtn">✦ Random Album</button>
            <button class="parlor-btn${isFav ? " active" : ""}" id="detailFavBtn">${isFav ? "★ Saved" : "☆ Save Release"}</button>
            <a class="parlor-btn" href="${escapeHtml(a.url)}" target="_blank" rel="noopener">↗ Open on Bandcamp</a>
          </div>
        </div>
      </div>

      <div class="deck-grid">
        <div class="iframe-shell">
          <iframe src="${iframeSrc}" title="${escapeHtml(a.artist)} — ${escapeHtml(a.title)}" seamless allow="autoplay"></iframe>
        </div>

        <div class="companion-card">
          <div class="card-kicker">${collageLabel}</div>
          <div class="mini-collage" id="miniCollage">
            ${collageItems.map(c => `
              <div class="mini-collage-item" data-idx="${c.idx}" title="${escapeHtml(c.title)} — ${escapeHtml(c.artist)}">
                <img src="${c.thumb}" alt="${escapeHtml(c.title)}" loading="lazy">
                <span>${escapeHtml(c.title)}</span>
              </div>
            `).join("")}
          </div>
          <div style="font-size:14px;color:var(--parchment-soft);line-height:1.55;">
            Curated directly from Bandcamp’s <em>gothic-americana + dark-folk</em> discover archive. Use the built-in <strong>⏮ / ⏭</strong> controls inside the Bandcamp deck to step through tracks, or open <strong>❖ Cover Wall</strong> to browse all 73 sleeves.
          </div>
        </div>
      </div>

      <div class="detail-nav">
        <button class="nav-btn prev" id="prevBtn" ${!prev ? "disabled" : ""}>
          <small>↤ Previous Album</small>
          <span>${prev ? `№ ${String(prev.idx).padStart(2, "0")} · ${escapeHtml(prev.title)}` : "—"}</span>
        </button>
        <button class="nav-btn next" id="nextBtn" ${!next ? "disabled" : ""}>
          <small>Next Album ↦</small>
          <span>${next ? `№ ${String(next.idx).padStart(2, "0")} · ${escapeHtml(next.title)}` : "—"}</span>
        </button>
      </div>

      <div class="kbd-bar">
        <span>↑ / K Prev Album</span>
        <span>↓ / J Next Album</span>
        <span>R Random</span>
        <span>W Cover Wall</span>
        <span>F Save</span>
      </div>
    </div>
  `;

  $("deckRandomBtn").addEventListener("click", pickRandomAlbum);
  $("detailFavBtn").addEventListener("click", () => toggleFavorite(a.idx));
  $("miniCollage").addEventListener("click", (e) => {
    const card = e.target.closest(".mini-collage-item");
    if (card) selectAlbum(Number(card.dataset.idx));
  });
  if (prev) $("prevBtn").addEventListener("click", () => selectAlbum(prev.idx));
  if (next) $("nextBtn").addEventListener("click", () => selectAlbum(next.idx));

  const histEl = $("historyItems");
  if (histEl) {
    histEl.addEventListener("click", (e) => {
      const chip = e.target.closest(".history-chip");
      if (chip) selectAlbum(Number(chip.dataset.idx));
    });
  }
  const clearHistBtn = $("clearHistBtn");
  if (clearHistBtn) {
    clearHistBtn.addEventListener("click", () => {
      state.history = [state.currentIdx];
      saveStorage();
      renderDetail();
      showToast("Cleared Recently Played history");
    });
  }

  $("detail").scrollTop = 0;
  const activeRow = document.querySelector(".row.active, .grid-tile.active");
  if (activeRow) activeRow.scrollIntoView({ block: "nearest", behavior: "smooth" });
}

function selectAlbum(idx) {
  state.currentIdx = Number(idx);
  recordHistory(state.currentIdx);
  if (state.wallOpen) {
    state.wallOpen = false;
    $("wallView").classList.remove("open");
    $("splitApp").classList.remove("hidden");
  }
  updateHeaderBadges();
  renderSidebar();
  renderDetail();
}

function toggleFavorite(idx) {
  const n = Number(idx);
  if (state.favorites.has(n)) {
    state.favorites.delete(n);
    showToast(`Removed № ${String(n).padStart(2, "0")} from Saved`);
  } else {
    state.favorites.add(n);
    showToast(`Saved № ${String(n).padStart(2, "0")}`);
  }
  saveStorage();
  updateHeaderBadges();
  renderSidebar();
  const favBtn = $("detailFavBtn");
  if (favBtn && state.currentIdx === n) {
    const isFav = state.favorites.has(n);
    favBtn.classList.toggle("active", isFav);
    favBtn.textContent = isFav ? "★ Saved" : "☆ Save Release";
  }
}

function toggleWall(force) {
  state.wallOpen = typeof force === "boolean" ? force : !state.wallOpen;
  $("wallView").classList.toggle("open", state.wallOpen);
  $("splitApp").classList.toggle("hidden", state.wallOpen);
  updateHeaderBadges();
  if (state.wallOpen) renderWall();
}

// Header & Sidebar Listeners
$("randomBtn").addEventListener("click", pickRandomAlbum);
$("favFilterBtn").addEventListener("click", () => {
  state.favoritesOnly = !state.favoritesOnly;
  updateHeaderBadges();
  renderSidebar();
  if (state.wallOpen) renderWall();
});
$("wallToggleBtn").addEventListener("click", () => toggleWall());
$("closeWallBtn").addEventListener("click", () => toggleWall(false));
$("remixCollageBtn").addEventListener("click", () => {
  buildBackdropCollage();
  showToast("Remixed 48-cover backdrop collage");
});

$("searchInput").addEventListener("input", (e) => {
  state.search = e.target.value;
  renderSidebar();
  if (state.wallOpen) renderWall();
});

$("sortSelect").addEventListener("change", (e) => {
  state.sortBy = e.target.value;
  renderSidebar();
  if (state.wallOpen) renderWall();
});

$("bandSelect").addEventListener("change", (e) => {
  state.bandFilter = e.target.value;
  renderSidebar();
  if (state.wallOpen) renderWall();
});

$("viewListBtn").addEventListener("click", () => {
  state.sidebarMode = "list";
  $("viewListBtn").classList.add("active");
  $("viewGridBtn").classList.remove("active");
  renderSidebar();
});
$("viewGridBtn").addEventListener("click", () => {
  state.sidebarMode = "grid";
  $("viewGridBtn").classList.add("active");
  $("viewListBtn").classList.remove("active");
  renderSidebar();
});

$("albumList").addEventListener("click", (e) => {
  const star = e.target.closest(".fav-star");
  if (star) {
    e.stopPropagation();
    toggleFavorite(star.dataset.fav);
    return;
  }
  const item = e.target.closest(".row, .grid-tile");
  if (item) selectAlbum(Number(item.dataset.idx));
});

$("wallGrid").addEventListener("click", (e) => {
  const card = e.target.closest(".wall-card");
  if (card) selectAlbum(Number(card.dataset.idx));
});

document.addEventListener("keydown", (e) => {
  const tag = (e.target && e.target.tagName) ? e.target.tagName.toLowerCase() : "";
  if (tag === "input" || tag === "select" || tag === "textarea") {
    if (e.key === "Escape") e.target.blur();
    return;
  }
  if (e.key === "Escape" && state.wallOpen) {
    toggleWall(false);
    return;
  }
  const pool = getFilteredSorted();
  const list = pool.length ? pool : ALBUMS;
  const pos = list.findIndex(x => x.idx === state.currentIdx);

  if (e.key === "ArrowDown" || e.key === "j") {
    e.preventDefault();
    if (pos >= 0 && pos < list.length - 1) selectAlbum(list[pos + 1].idx);
  } else if (e.key === "ArrowUp" || e.key === "k") {
    e.preventDefault();
    if (pos > 0) selectAlbum(list[pos - 1].idx);
  } else if (e.key === "r" || e.key === "R") {
    pickRandomAlbum();
  } else if (e.key === "w" || e.key === "W") {
    toggleWall();
  } else if (e.key === "f" || e.key === "F") {
    toggleFavorite(state.currentIdx);
  }
});

// Init
loadStorage();
if (!state.history.length) recordHistory(1);
populateBands();
buildBackdropCollage();
updateHeaderBadges();
renderSidebar();
renderDetail();
</script>
<script src="./now-playing-dock.js" defer></script>
<script src="./chrome-cast.js" defer></script>
</body>
</html>
