<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SLUSHWAVE MEGALITH · 424 Releases</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,400;1,600&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --void: #06050e;
  --night: #0c0a1a;
  --glass: rgba(13, 11, 28, 0.72);
  --glass-strong: rgba(12, 10, 26, 0.86);
  --glass-card: rgba(22, 18, 44, 0.66);
  --border: rgba(196, 181, 253, 0.18);
  --border-hi: rgba(103, 232, 249, 0.48);
  --mist: #efeaff;
  --mist-soft: #b9b1d8;
  --mist-dim: #7f77a6;
  --lavender: #c4b5fd;
  --cyan: #67e8f9;
  --magenta: #f472b6;
  --violet: #8b5cf6;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: var(--void);
  color: var(--mist);
  font-family: 'Space Grotesk', sans-serif;
  font-size: 15px;
  min-height: 100vh;
  overflow-x: hidden;
}

/* FULL-BLEED HAZY COVER-ART COLLAGE BACKDROP */
.collage-bg {
  position: fixed;
  inset: -40px;
  z-index: 0;
  overflow: hidden;
  pointer-events: none;
}
.collage-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 6px;
  width: calc(100% + 80px);
  height: calc(100% + 80px);
  filter: blur(5px) saturate(1.3) brightness(0.42);
  animation: slowDrift 38s ease-in-out infinite alternate;
  transform-origin: center;
}
@media (max-width: 900px) {
  .collage-grid { grid-template-columns: repeat(5, 1fr); }
}
.collage-tile {
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: cover;
  opacity: 0.92;
  transition: opacity 0.8s ease;
}

/* Active album color bloom */
.active-bloom {
  position: fixed;
  inset: -60px;
  z-index: 1;
  pointer-events: none;
  background-size: cover;
  background-position: center;
  filter: blur(65px) saturate(1.5) brightness(0.38);
  opacity: 0.55;
  transition: background-image 0.9s ease, opacity 0.9s ease;
}

/* Nocturnal mist + subtle VHS scanline sheen */
.mist-veil {
  position: fixed;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  background:
    radial-gradient(ellipse 75% 60% at 15% 15%, rgba(139, 92, 246, 0.24), transparent 65%),
    radial-gradient(ellipse 70% 60% at 85% 82%, rgba(103, 232, 249, 0.16), transparent 65%),
    radial-gradient(ellipse 60% 50% at 75% 20%, rgba(244, 114, 182, 0.14), transparent 60%),
    linear-gradient(180deg, rgba(6, 5, 14, 0.58) 0%, rgba(6, 5, 14, 0.78) 100%);
}
.mist-veil::after {
  content: '';
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    rgba(255, 255, 255, 0.018) 0px,
    rgba(255, 255, 255, 0.018) 1px,
    transparent 1px,
    transparent 3px
  );
}

@keyframes slowDrift {
  0% { transform: translate3d(-12px, -10px, 0) scale(1.04); }
  100% { transform: translate3d(14px, 12px, 0) scale(1.09); }
}
@keyframes softFadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes driftGlow {
  0%, 100% { box-shadow: 0 0 0 0 rgba(103, 232, 249, 0.45); }
  50% { box-shadow: 0 0 18px 2px rgba(244, 114, 182, 0.45); }
}

/* HEADER */
.header {
  position: relative;
  z-index: 20;
  padding: 16px 28px;
  background: var(--glass-strong);
  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);
  border-bottom: 1px solid var(--border);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
}

.brand-wrap {
  display: flex;
  align-items: center;
  gap: 14px;
}
.brand-sigil {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  background: linear-gradient(135deg, rgba(139, 92, 246, 0.35), rgba(103, 232, 249, 0.28));
  border: 1px solid var(--border-hi);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  color: var(--cyan);
  text-shadow: 0 0 14px rgba(103, 232, 249, 0.7);
  flex-shrink: 0;
}
.brand {
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: clamp(20px, 2.6vw, 30px);
  letter-spacing: 3px;
  line-height: 1;
  background: linear-gradient(90deg, #f5f0ff 0%, var(--lavender) 45%, var(--cyan) 85%, var(--magenta) 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.subbrand {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 2.4px;
  text-transform: uppercase;
  color: var(--mist-soft);
  margin-top: 5px;
}

.header-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}

.pill-btn {
  background: rgba(25, 20, 48, 0.72);
  color: var(--mist);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 8px 14px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10.5px;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  cursor: pointer;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all 0.2s var(--ease);
}
.pill-btn:hover {
  border-color: var(--cyan);
  background: rgba(103, 232, 249, 0.14);
  transform: translateY(-1px);
}
.pill-btn.active {
  background: linear-gradient(135deg, rgba(139, 92, 246, 0.45), rgba(244, 114, 182, 0.35));
  border-color: var(--cyan);
  color: #fff;
}
.pill-btn.drifting {
  background: linear-gradient(135deg, rgba(103, 232, 249, 0.32), rgba(244, 114, 182, 0.35));
  border-color: var(--cyan);
  animation: driftGlow 2.8s ease-in-out infinite;
}
.pill-btn .badge {
  background: rgba(6, 5, 14, 0.7);
  color: var(--cyan);
  padding: 1px 6px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 600;
}

/* MAIN LAYOUT */
.app {
  position: relative;
  z-index: 10;
  display: grid;
  grid-template-columns: 400px 1fr;
  min-height: calc(100vh - 78px);
}
@media (max-width: 960px) {
  .header { padding: 14px 16px; }
  .app { grid-template-columns: 1fr; }
}

/* SIDEBAR */
.sidebar {
  background: var(--glass);
  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  max-height: calc(100vh - 78px);
  overflow: hidden;
}
@media (max-width: 960px) {
  .sidebar { max-height: 48vh; border-right: none; border-bottom: 1px solid var(--border); }
}

.sidebar-controls {
  padding: 14px 16px 12px;
  border-bottom: 1px solid var(--border);
  background: rgba(10, 8, 22, 0.72);
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.scope-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--mist-dim);
}
.scope-row .count { color: var(--cyan); font-weight: 600; }

.source-tabs {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
}
.source-tab {
  background: rgba(20, 16, 40, 0.7);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--mist-soft);
  padding: 7px 6px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.6px;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.18s;
}
.source-tab:hover { border-color: var(--lavender); color: #fff; }
.source-tab.active {
  background: linear-gradient(135deg, rgba(139, 92, 246, 0.42), rgba(103, 232, 249, 0.25));
  border-color: var(--cyan);
  color: #fff;
  font-weight: 600;
}

.filter-row {
  display: grid;
  grid-template-columns: 1fr 122px;
  gap: 6px;
}
.search-input, .artist-select {
  background: rgba(6, 5, 14, 0.72);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--mist);
  padding: 8px 11px;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 12.5px;
  outline: none;
  width: 100%;
}
.search-input::placeholder { color: var(--mist-dim); }
.search-input:focus, .artist-select:focus { border-color: var(--cyan); }

.sidebar-tools {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}
.mini-toggle {
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 999px;
  color: var(--mist-soft);
  padding: 4px 10px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 9.5px;
  letter-spacing: 1px;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.15s;
}
.mini-toggle:hover, .mini-toggle.active {
  border-color: var(--magenta);
  color: var(--mist);
  background: rgba(244, 114, 182, 0.16);
}

.album-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px 10px 24px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.album-list.mini-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 7px;
  align-content: start;
}

.row {
  padding: 8px 10px;
  border-radius: 12px;
  border: 1px solid transparent;
  background: rgba(22, 18, 44, 0.45);
  cursor: pointer;
  display: grid;
  grid-template-columns: 46px 1fr 22px;
  gap: 10px;
  align-items: center;
  transition: all 0.18s var(--ease);
}
.row:hover {
  background: rgba(34, 28, 66, 0.72);
  border-color: var(--border);
  transform: translateX(3px);
}
.row.active {
  background: linear-gradient(135deg, rgba(139, 92, 246, 0.34), rgba(103, 232, 249, 0.20));
  border-color: var(--cyan);
  box-shadow: 0 0 18px rgba(103, 232, 249, 0.18);
}

.thumb {
  width: 46px;
  height: 46px;
  border-radius: 8px;
  object-fit: cover;
  background: var(--night);
  border: 1px solid rgba(255,255,255,0.1);
}
.row .info { min-width: 0; }
.row-title {
  font-weight: 600;
  font-size: 13.5px;
  color: var(--mist);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.row-artist {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 13.5px;
  color: var(--lavender);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-top: 1px;
}
.row-meta {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  letter-spacing: 1px;
  color: var(--mist-dim);
  text-transform: uppercase;
  margin-top: 3px;
  display: flex;
  gap: 6px;
  align-items: center;
}
.tag-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--cyan);
  flex-shrink: 0;
}
.tag-dot.w { background: var(--magenta); }

.fav-star {
  background: transparent;
  border: none;
  color: var(--mist-dim);
  font-size: 15px;
  cursor: pointer;
  line-height: 1;
  transition: transform 0.15s, color 0.15s;
}
.fav-star:hover { color: var(--cyan); transform: scale(1.2); }
.fav-star.saved { color: var(--magenta); }

/* Mini-grid tile inside sidebar */
.grid-tile {
  position: relative;
  aspect-ratio: 1 / 1;
  border-radius: 10px;
  overflow: hidden;
  cursor: pointer;
  border: 1.5px solid transparent;
  background: var(--night);
  transition: transform 0.2s var(--ease), border-color 0.2s;
}
.grid-tile:hover { transform: scale(1.04); border-color: var(--lavender); z-index: 2; }
.grid-tile.active { border-color: var(--cyan); box-shadow: 0 0 16px rgba(103, 232, 249, 0.45); }
.grid-tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
.grid-tile-cap {
  position: absolute;
  inset: auto 0 0 0;
  padding: 16px 6px 5px;
  background: linear-gradient(180deg, transparent, rgba(6,5,14,0.92));
  font-size: 10px;
  line-height: 1.2;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--mist);
}

/* DETAIL SPLIT DECK */
.detail {
  padding: 24px 34px 60px;
  overflow-y: auto;
  max-height: calc(100vh - 78px);
}
@media (max-width: 960px) {
  .detail { max-height: none; padding: 18px 16px 48px; }
}

.detail-stage {
  max-width: 980px;
  margin: 0 auto;
  animation: softFadeUp 0.34s var(--ease);
}

/* HERO ALBUM CARD */
.hero-card {
  background: var(--glass);
  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);
  border: 1px solid var(--border);
  border-radius: 22px;
  padding: 22px 24px;
  margin-bottom: 22px;
  display: grid;
  grid-template-columns: 148px 1fr;
  gap: 22px;
  align-items: center;
  box-shadow: 0 14px 44px rgba(0, 0, 0, 0.48);
}
@media (max-width: 680px) {
  .hero-card { grid-template-columns: 1fr; text-align: center; justify-items: center; }
}
.hero-art {
  width: 148px;
  height: 148px;
  border-radius: 14px;
  object-fit: cover;
  border: 1.5px solid rgba(196, 181, 253, 0.32);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 28px rgba(139, 92, 246, 0.25);
}
.hero-badges {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  margin-bottom: 8px;
}
@media (max-width: 680px) {
  .hero-badges { justify-content: center; }
}
.chip {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  padding: 3px 10px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: rgba(6, 5, 14, 0.55);
  color: var(--lavender);
}
.chip.col { border-color: rgba(103, 232, 249, 0.45); color: var(--cyan); }
.chip.wish { border-color: rgba(244, 114, 182, 0.45); color: var(--magenta); }

.hero-title {
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  font-size: clamp(22px, 3vw, 32px);
  line-height: 1.12;
  color: #fff;
}
.hero-artist {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 22px;
  color: var(--lavender);
  margin-top: 5px;
}
.hero-featured {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--mist-soft);
  margin-top: 10px;
}
.hero-featured b { color: var(--cyan); font-weight: 600; }
.hero-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 14px;
}
@media (max-width: 680px) {
  .hero-actions { justify-content: center; }
}

/* BANDCAMP PLAYER DECK */
.deck-grid {
  display: grid;
  grid-template-columns: minmax(310px, 420px) 1fr;
  gap: 24px;
  align-items: start;
}
@media (max-width: 820px) {
  .deck-grid { grid-template-columns: 1fr; }
}

.iframe-shell {
  background: var(--glass-strong);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--border-hi);
  border-radius: 18px;
  padding: 10px;
  box-shadow: 0 14px 40px rgba(0, 0, 0, 0.55), 0 0 24px rgba(103, 232, 249, 0.12);
}
.iframe-shell iframe {
  display: block;
  width: 100%;
  height: 470px;
  border: 0;
  border-radius: 12px;
  background: #0c0a1a;
}

/* Right companion collage card: Related / Same Artist + Ambient Artwork Strip */
.companion-card {
  background: var(--glass);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.card-kicker {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 2.2px;
  text-transform: uppercase;
  color: var(--cyan);
}
.mini-collage {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.mini-collage-item {
  position: relative;
  aspect-ratio: 1 / 1;
  border-radius: 10px;
  overflow: hidden;
  cursor: pointer;
  border: 1px solid var(--border);
  transition: transform 0.2s var(--ease), border-color 0.2s;
}
.mini-collage-item:hover { transform: translateY(-2px) scale(1.03); border-color: var(--cyan); }
.mini-collage-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
.mini-collage-item span {
  position: absolute;
  inset: auto 0 0 0;
  padding: 14px 6px 5px;
  background: linear-gradient(180deg, transparent, rgba(6,5,14,0.92));
  font-size: 10px;
  color: var(--mist);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* NAV BAR */
.detail-nav {
  display: flex;
  gap: 12px;
  margin-top: 22px;
}
.nav-btn {
  flex: 1;
  background: var(--glass);
  backdrop-filter: blur(18px);
  border: 1px solid var(--border);
  border-radius: 14px;
  color: var(--mist);
  padding: 12px 16px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  cursor: pointer;
  text-align: left;
  transition: all 0.18s var(--ease);
}
.nav-btn:hover:not(:disabled) {
  border-color: var(--cyan);
  background: rgba(103, 232, 249, 0.12);
  transform: translateY(-2px);
}
.nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.nav-btn.next { text-align: right; }
.nav-btn small {
  display: block;
  font-size: 9px;
  color: var(--lavender);
  margin-bottom: 4px;
}
.nav-btn span {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 13.5px;
  font-weight: 600;
  text-transform: none;
  letter-spacing: 0;
}

.kbd-bar {
  margin-top: 14px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 9.5px;
  letter-spacing: 1.3px;
  color: var(--mist-dim);
  text-transform: uppercase;
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
}

/* FULL COVER WALL OVERLAY VIEW */
.wall-view {
  position: relative;
  z-index: 12;
  display: none;
  padding: 20px 24px 60px;
  max-width: 1500px;
  margin: 0 auto;
}
.wall-view.open { display: block; }
.app.hidden { display: none; }

.wall-header {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
  padding: 12px 18px;
  background: var(--glass-strong);
  backdrop-filter: blur(20px);
  border: 1px solid var(--border);
  border-radius: 16px;
}
.wall-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
  gap: 10px;
}
.wall-card {
  position: relative;
  aspect-ratio: 1 / 1;
  border-radius: 12px;
  overflow: hidden;
  cursor: pointer;
  border: 1.5px solid var(--border);
  background: var(--night);
  transition: transform 0.22s var(--ease), border-color 0.2s, box-shadow 0.2s;
}
.wall-card:hover {
  transform: translateY(-4px) scale(1.03);
  border-color: var(--cyan);
  box-shadow: 0 10px 28px rgba(0,0,0,0.6), 0 0 20px rgba(103, 232, 249, 0.25);
  z-index: 3;
}
.wall-card.active {
  border-color: var(--magenta);
  box-shadow: 0 0 22px rgba(244, 114, 182, 0.55);
}
.wall-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
.wall-cap {
  position: absolute;
  inset: auto 0 0 0;
  padding: 24px 8px 7px;
  background: linear-gradient(180deg, transparent, rgba(6,5,14,0.94));
}
.wall-cap-title {
  font-size: 11.5px;
  font-weight: 600;
  color: #fff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.wall-cap-artist {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 11.5px;
  color: var(--lavender);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* TOAST */
.toast {
  position: fixed;
  bottom: 22px;
  right: 22px;

const ALBUMS = RAW.map(r => ({
  idx: r[0],
  src: r[1],
  type: r[2],
  id: r[3],
  artId: r[4],
  artist: r[5],
  title: r[6],
  url: r[7],
  featured: r[8],
  thumb: `https://f4.bcbits.com/img/a${r[4]}_9.jpg`,
  cover: `https://f4.bcbits.com/img/a${r[4]}_16.jpg`
}));

const STORAGE_FAVS = "slushwave_megalith_favs_v1";

const state = {
  source: "ALL",
  search: "",
  artistFilter: "ALL",
  favoritesOnly: false,
  sidebarMode: "list",
  wallOpen: false,
  currentIdx: 1,
  favorites: new Set()
};

const $ = id => document.getElementById(id);

function loadStorage() {
  try {
    const raw = localStorage.getItem(STORAGE_FAVS);
    if (raw) JSON.parse(raw).forEach(n => state.favorites.add(Number(n)));
  } catch (_) {}
}
function saveStorage() {
  try {
    localStorage.setItem(STORAGE_FAVS, JSON.stringify([...state.favorites]));
  } catch (_) {}
}

function escapeHtml(s) {
  if (s == null) return "";
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

let toastTimer = null;
function showToast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}

function fisherYates(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildBackdropCollage() {
  const grid = $("collageGrid");
  const sample = fisherYates(ALBUMS).slice(0, 48);
  grid.innerHTML = sample.map(a => `<img class="collage-tile" src="${a.thumb}" alt="" loading="lazy">`).join("");
}

function populateArtists() {
  const sel = $("artistSelect");
  TOP_ARTISTS.forEach(([name, count]) => {
    const opt = document.createElement("option");
    opt.value = name;
    opt.textContent = `${name} (${count})`;
    sel.appendChild(opt);
  });
}

function getFiltered() {
  const q = state.search.trim().toLowerCase();
  return ALBUMS.filter(a => {
    if (state.source !== "ALL" && a.src !== state.source) return false;
    if (state.favoritesOnly && !state.favorites.has(a.idx)) return false;
    if (state.artistFilter !== "ALL" && a.artist !== state.artistFilter) return false;
    if (q) {
      const hay = `${a.idx} ${a.artist} ${a.title} ${a.featured}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

function pickRandomAlbum() {
  const pool = getFiltered();
  const base = pool.length ? pool : ALBUMS;
  const choices = base.filter(a => a.idx !== state.currentIdx);
  const pick = choices.length ? choices[Math.floor(Math.random() * choices.length)] : base[0];
  selectAlbum(pick.idx);
}

function updateHeaderBadges() {
  $("favCount").textContent = String(state.favorites.size);
  $("favFilterBtn").classList.toggle("active", state.favoritesOnly);
  $("wallToggleBtn").classList.toggle("active", state.wallOpen);
}

function renderSidebar() {
  const listEl = $("albumList");
  const filtered = getFiltered();
  $("visibleCount").textContent = String(filtered.length);

  if (state.favoritesOnly) $("scopeLabel").textContent = "Saved Favorites";
  else if (state.artistFilter !== "ALL") $("scopeLabel").textContent = state.artistFilter;
  else if (state.source === "c") $("scopeLabel").textContent = "Collection";
  else if (state.source === "w") $("scopeLabel").textContent = "Wishlist";
  else $("scopeLabel").textContent = "All Releases";

  listEl.classList.toggle("mini-grid", state.sidebarMode === "grid");

  if (!filtered.length) {
    listEl.innerHTML = `<div style="padding:36px 16px;text-align:center;color:var(--mist-dim);font-style:italic;">No releases match this filter.</div>`;
    return;
  }

  if (state.sidebarMode === "grid") {
    listEl.innerHTML = filtered.map(a => `
      <div class="grid-tile${a.idx === state.currentIdx ? " active" : ""}" data-idx="${a.idx}" title="${escapeHtml(a.title)} — ${escapeHtml(a.artist)}">
        <img src="${a.thumb}" alt="${escapeHtml(a.title)}" loading="lazy">
        <div class="grid-tile-cap">${escapeHtml(a.title)}</div>
      </div>
    `).join("");
    return;
  }

  listEl.innerHTML = filtered.map(a => {
    const isFav = state.favorites.has(a.idx);
    const isActive = a.idx === state.currentIdx;
    return `
      <div class="row${isActive ? " active" : ""}" data-idx="${a.idx}">
        <img class="thumb" src="${a.thumb}" alt="" loading="lazy">
        <div class="info">
          <div class="row-title">${escapeHtml(a.title)}</div>
          <div class="row-artist">${escapeHtml(a.artist)}</div>
          <div class="row-meta">
            <span class="tag-dot ${a.src}"></span>
            <span>#${String(a.idx).padStart(3, "0")}</span>
            <span>·</span>
            <span>${a.src === "c" ? "Collection" : "Wishlist"}</span>
          </div>
        </div>
        <button class="fav-star${isFav ? " saved" : ""}" data-fav="${a.idx}" title="Save release">${isFav ? "★" : "☆"}</button>
      </div>
    `;
  }).join("");
}

function renderWall() {
  const filtered = getFiltered();
  $("wallCount").textContent = String(filtered.length);
  $("wallGrid").innerHTML = filtered.map(a => `
    <div class="wall-card${a.idx === state.currentIdx ? " active" : ""}" data-idx="${a.idx}">
      <img src="${a.thumb}" alt="${escapeHtml(a.title)}" loading="lazy">
      <div class="wall-cap">
        <div class="wall-cap-title">${escapeHtml(a.title)}</div>
        <div class="wall-cap-artist">${escapeHtml(a.artist)}</div>
      </div>
    </div>
  `).join("");
}

                <span>${escapeHtml(c.title)}</span>
              </div>
            `).join("")}
          </div>
          <div style="font-size:12.5px;color:var(--mist-soft);line-height:1.5;">
            Use the built-in <strong>⏮ / ⏭</strong> buttons and tracklist inside the Bandcamp player to skip tracks, or click <strong>✦ Random</strong> / <strong>❖ Cover Wall</strong> to jump to another release.
          </div>
        </div>
      </div>

      <div class="detail-nav">
        <button class="nav-btn prev" id="prevBtn" ${!prev ? "disabled" : ""}>
          <small>↤ Previous Album</small>
          <span>${prev ? `#${String(prev.idx).padStart(3, "0")} · ${escapeHtml(prev.title)}` : "—"}</span>
        </button>
        <button class="nav-btn next" id="nextBtn" ${!next ? "disabled" : ""}>
          <small>Next Album ↦</small>
          <span>${next ? `#${String(next.idx).padStart(3, "0")} · ${escapeHtml(next.title)}` : "—"}</span>
        </button>
      </div>

      <div class="kbd-bar">
        <span>↑ / K Prev Album</span>
        <span>↓ / J Next Album</span>
        <span>R Random</span>
        <span>W Cover Wall</span>
        <span>F Save</span>
      </div>
    </div>
  `;

  $("deckRandomBtn").addEventListener("click", pickRandomAlbum);
  $("detailFavBtn").addEventListener("click", () => toggleFavorite(a.idx));
  $("miniCollage").addEventListener("click", (e) => {
    const card = e.target.closest(".mini-collage-item");
    if (card) selectAlbum(Number(card.dataset.idx));
  });
  if (prev) $("prevBtn").addEventListener("click", () => selectAlbum(prev.idx));
  if (next) $("nextBtn").addEventListener("click", () => selectAlbum(next.idx));

  $("detail").scrollTop = 0;
  const activeRow = document.querySelector(".row.active, .grid-tile.active");
  if (activeRow) activeRow.scrollIntoView({ block: "nearest", behavior: "smooth" });
}

function selectAlbum(idx) {
  state.currentIdx = Number(idx);
  if (state.wallOpen) {
    state.wallOpen = false;
    $("wallView").classList.remove("open");
    $("splitApp").classList.remove("hidden");
  }
  updateHeaderBadges();
  renderSidebar();
  renderDetail();
}

function toggleFavorite(idx) {
  const n = Number(idx);
  if (state.favorites.has(n)) {
    state.favorites.delete(n);
    showToast(`Removed #${String(n).padStart(3, "0")} from Saved`);
  } else {
    state.favorites.add(n);
    showToast(`Saved #${String(n).padStart(3, "0")}`);
  }
  saveStorage();
  updateHeaderBadges();
  renderSidebar();
  const favBtn = $("detailFavBtn");
  if (favBtn && state.currentIdx === n) {
    const isFav = state.favorites.has(n);
    favBtn.classList.toggle("active", isFav);
    favBtn.textContent = isFav ? "★ Saved" : "☆ Save Release";
  }
}

function toggleWall(force) {
  state.wallOpen = typeof force === "boolean" ? force : !state.wallOpen;
  $("wallView").classList.toggle("open", state.wallOpen);
  $("splitApp").classList.toggle("hidden", state.wallOpen);
  updateHeaderBadges();
  if (state.wallOpen) renderWall();
}

// Header & Sidebar Listeners
$("randomBtn").addEventListener("click", pickRandomAlbum);
$("favFilterBtn").addEventListener("click", () => {
  state.favoritesOnly = !state.favoritesOnly;
  updateHeaderBadges();
  renderSidebar();
  if (state.wallOpen) renderWall();
});
$("wallToggleBtn").addEventListener("click", () => toggleWall());
$("closeWallBtn").addEventListener("click", () => toggleWall(false));
$("remixCollageBtn").addEventListener("click", () => {
  buildBackdropCollage();
  showToast("Remixed 48-cover backdrop collage");
});

$("sourceTabs").addEventListener("click", (e) => {
  const btn = e.target.closest(".source-tab");
  if (!btn) return;
  state.source = btn.dataset.src;
  document.querySelectorAll(".source-tab").forEach(b => b.classList.toggle("active", b === btn));
  renderSidebar();
  if (state.wallOpen) renderWall();
});

$("searchInput").addEventListener("input", (e) => {
  state.search = e.target.value;
  renderSidebar();
  if (state.wallOpen) renderWall();
});

$("artistSelect").addEventListener("change", (e) => {
  state.artistFilter = e.target.value;
  renderSidebar();
  if (state.wallOpen) renderWall();
});

$("viewListBtn").addEventListener("click", () => {
  state.sidebarMode = "list";
  $("viewListBtn").classList.add("active");
  $("viewGridBtn").classList.remove("active");
  renderSidebar();
});
$("viewGridBtn").addEventListener("click", () => {
  state.sidebarMode = "grid";
  $("viewGridBtn").classList.add("active");
  $("viewListBtn").classList.remove("active");
  renderSidebar();
});

$("albumList").addEventListener("click", (e) => {
  const star = e.target.closest(".fav-star");
  if (star) {
    e.stopPropagation();
    toggleFavorite(star.dataset.fav);
    return;
  }
  const item = e.target.closest(".row, .grid-tile");
  if (item) selectAlbum(Number(item.dataset.idx));
});

$("wallGrid").addEventListener("click", (e) => {
  const card = e.target.closest(".wall-card");
  if (card) selectAlbum(Number(card.dataset.idx));
});

document.addEventListener("keydown", (e) => {
  const tag = (e.target && e.target.tagName) ? e.target.tagName.toLowerCase() : "";
  if (tag === "input" || tag === "select" || tag === "textarea") {
    if (e.key === "Escape") e.target.blur();
    return;
  }
  const pool = getFiltered();
  const list = pool.length ? pool : ALBUMS;
  const pos = list.findIndex(x => x.idx === state.currentIdx);

  if (e.key === "ArrowDown" || e.key === "j") {
    e.preventDefault();
    if (pos >= 0 && pos < list.length - 1) selectAlbum(list[pos + 1].idx);
  } else if (e.key === "ArrowUp" || e.key === "k") {
    e.preventDefault();
    if (pos > 0) selectAlbum(list[pos - 1].idx);
  } else if (e.key === "r" || e.key === "R") {
    pickRandomAlbum();
  } else if (e.key === "w" || e.key === "W") {
    toggleWall();
  } else if (e.key === "f" || e.key === "F") {
    toggleFavorite(state.currentIdx);
  } else if (e.key === "Escape" && state.wallOpen) {
    toggleWall(false);
  }
});

// Init
loadStorage();
populateArtists();
buildBackdropCollage();
updateHeaderBadges();
renderSidebar();
renderDetail();
</script>
<script src="./chrome-cast.js" defer></script>
</body>
</html>
